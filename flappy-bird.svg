<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flappy Bird Arcade Matrix Rioon7337">
  <defs>
    <radialGradient id="bgFlap" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a1a3e"/>
      <stop offset="60%" stop-color="#07071a"/>
      <stop offset="100%" stop-color="#050512"/>
    </radialGradient>

    <pattern id="flapGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#00f0ff" stroke-width="0.35" opacity="0.05"/>
    </pattern>

    <!-- Animated Neon Border Gradient -->
    <linearGradient id="rgbFlap" gradientUnits="userSpaceOnUse" x1="12" y1="125" x2="888" y2="125">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#d946ef">
        <animate attributeName="stop-color" values="#d946ef;#00f0ff;#ff73fa;#d946ef" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#00ffcc">
        <animate attributeName="stop-color" values="#00ffcc;#ff73fa;#00f0ff;#00ffcc" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 125" to="360 450 125" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Pipe Neon Gradient (Cyber Emerald & Cyan) -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#00bd68"/>
      <stop offset="100%" stop-color="#004d2a"/>
    </linearGradient>

    <linearGradient id="pipeCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55ffaa"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#00a855"/>
      <stop offset="100%" stop-color="#00381e"/>
    </linearGradient>

    <!-- Ground Stripe Pattern -->
    <pattern id="groundStripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="12" height="24" fill="#0d1f4a"/>
      <rect x="12" width="12" height="24" fill="#081432"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowFlap" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="neonOuterFlap" x="-10%" y="-18%" width="120%" height="136%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="birdGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clipFlap">
      <rect x="12" y="12" width="876" height="226" rx="16"/>
    </clipPath>
  </defs>

  <!-- Outer Neon Aura -->
  <rect x="12" y="12" width="876" height="226" rx="16" fill="none" stroke="url(#rgbFlap)" stroke-width="5" opacity="0.32" filter="url(#neonOuterFlap)"/>
  <rect x="12" y="12" width="876" height="226" rx="16" fill="url(#bgFlap)"/>
  <rect x="12" y="12" width="876" height="226" rx="16" fill="url(#flapGrid)"/>

  <!-- Cyber Corners -->
  <path d="M22 42 L22 22 L42 22" stroke="#00f0ff" stroke-width="2" fill="none" opacity=".85"/>
  <path d="M878 42 L878 22 L858 22" stroke="#00f0ff" stroke-width="2" fill="none" opacity=".85"/>
  <path d="M22 208 L22 228 L42 228" stroke="#d946ef" stroke-width="2" fill="none" opacity=".85"/>
  <path d="M878 208 L878 228 L858 228" stroke="#d946ef" stroke-width="2" fill="none" opacity=".85"/>

  <!-- Arcade HUD Labels -->
  <text x="32" y="32" font-family="'Fira Code', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#00f0ff" opacity="0.95">// FLAPPY MATRIX &#183; RIOON7337</text>
  <text x="450" y="32" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#00ffcc" opacity="0.85">PASS: 073 &#183; LEVEL 04</text>
  <text x="868" y="32" text-anchor="end" font-family="'Fira Code', ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#ff73fa" opacity="0.95">BEST: 250807</text>

  <!-- Animated Border & Traveling Tracer -->
  <rect x="12" y="12" width="876" height="226" rx="16" fill="none" stroke="url(#rgbFlap)" stroke-width="1.6"/>
  <rect x="12" y="12" width="876" height="226" rx="16" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.9" pathLength="1000" stroke-dasharray="85 915" filter="url(#glowFlap)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Game Playfield Area -->
  <g clip-path="url(#clipFlap)">
    <!-- Parallax Background Cyber Buildings Silhouette -->
    <g opacity="0.25">
      <path d="M0 210 L30 210 L30 150 L60 150 L60 210 L110 210 L110 130 L150 130 L150 210 L220 210 L220 160 L270 160 L270 210 L340 210 L340 120 L380 120 L380 210 L450 210 L450 155 L490 155 L490 210 L560 210 L560 140 L610 140 L610 210 L680 210 L680 125 L730 125 L730 210 L800 210 L800 165 L840 165 L840 210 L900 210 L900 135 L960 135 L960 210 L1020 210 L1020 150 L1060 150 L1060 210 L1140 210 L1140 130 L1200 210" fill="#00f0ff">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="18s" repeatCount="indefinite"/>
      </path>
      <!-- Cyber Window Dots -->
      <g fill="#00f0ff" opacity="0.6">
        <circle cx="45" cy="165" r="1.5"/><circle cx="45" cy="180" r="1.5"/>
        <circle cx="130" cy="145" r="1.5"/><circle cx="130" cy="160" r="1.5"/><circle cx="130" cy="175" r="1.5"/>
        <circle cx="360" cy="135" r="1.5"/><circle cx="360" cy="155" r="1.5"/><circle cx="360" cy="175" r="1.5"/>
        <circle cx="705" cy="140" r="1.5"/><circle cx="705" cy="160" r="1.5"/><circle cx="705" cy="180" r="1.5"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Floating Background Stars / Dust -->
    <g fill="#ffffff" opacity="0.4">
      <circle cx="80" cy="60" r="1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="85" r="1.2"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="50" r="0.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="75" r="1.3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="55" r="1.1"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="90" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Endless Scrolling Pipes Group -->
    <g>
      <!-- We have 6 pairs of pipes across 1200px (200px interval). Animating translate 0 to -600px creates seamless infinite loop! -->
      <g>
        <!-- Pipe Pair 1: x = 260. Gap at Y 95 to 165 (gap height 70) -->
        <g transform="translate(260 0)">
          <!-- Top Pipe -->
          <rect x="0" y="38" width="44" height="57" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <rect x="-3" y="85" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <line x1="8" y1="38" x2="8" y2="85" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Bottom Pipe -->
          <rect x="-3" y="163" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <rect x="0" y="173" width="44" height="37" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <line x1="8" y1="175" x2="8" y2="210" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Cyber Coin in Gap -->
          <circle cx="22" cy="130" r="7" fill="#ffd700" stroke="#ff73fa" stroke-width="1" filter="url(#glowFlap)">
            <animate attributeName="r" values="6.5;7.5;6.5" dur="1s" repeatCount="indefinite"/>
          </circle>
          <text x="22" y="133.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" font-weight="900" fill="#07071a">◆</text>
        </g>

        <!-- Pipe Pair 2: x = 460. Gap at Y 70 to 140 (gap height 70) -->
        <g transform="translate(460 0)">
          <!-- Top Pipe -->
          <rect x="0" y="38" width="44" height="32" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <rect x="-3" y="60" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <line x1="8" y1="38" x2="8" y2="60" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Bottom Pipe -->
          <rect x="-3" y="138" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <rect x="0" y="148" width="44" height="62" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <line x1="8" y1="150" x2="8" y2="210" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Cyber Coin in Gap -->
          <circle cx="22" cy="105" r="7" fill="#ffd700" stroke="#00ffcc" stroke-width="1" filter="url(#glowFlap)"/>
          <text x="22" y="108.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" font-weight="900" fill="#07071a">◆</text>
        </g>

        <!-- Pipe Pair 3: x = 660. Gap at Y 120 to 190 (gap height 70) -->
        <g transform="translate(660 0)">
          <!-- Top Pipe -->
          <rect x="0" y="38" width="44" height="82" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <rect x="-3" y="110" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <line x1="8" y1="38" x2="8" y2="110" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Bottom Pipe -->
          <rect x="-3" y="188" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <rect x="0" y="198" width="44" height="12" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <!-- Cyber Coin in Gap -->
          <circle cx="22" cy="155" r="7" fill="#ffd700" stroke="#ff73fa" stroke-width="1" filter="url(#glowFlap)"/>
          <text x="22" y="158.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" font-weight="900" fill="#07071a">◆</text>
        </g>

        <!-- Pipe Pair 4: x = 860. Gap at Y 85 to 155 (gap height 70) -->
        <g transform="translate(860 0)">
          <!-- Top Pipe -->
          <rect x="0" y="38" width="44" height="47" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <rect x="-3" y="75" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <line x1="8" y1="38" x2="8" y2="75" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Bottom Pipe -->
          <rect x="-3" y="153" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <rect x="0" y="163" width="44" height="47" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <line x1="8" y1="165" x2="8" y2="210" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Cyber Coin in Gap -->
          <circle cx="22" cy="120" r="7" fill="#ffd700" stroke="#00ffcc" stroke-width="1" filter="url(#glowFlap)"/>
          <text x="22" y="123.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" font-weight="900" fill="#07071a">◆</text>
        </g>

        <!-- Pipe Pair 5: x = 1060. Gap at Y 110 to 180 (gap height 70) -->
        <g transform="translate(1060 0)">
          <!-- Top Pipe -->
          <rect x="0" y="38" width="44" height="72" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <rect x="-3" y="100" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <line x1="8" y1="38" x2="8" y2="100" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
          <!-- Bottom Pipe -->
          <rect x="-3" y="178" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <rect x="0" y="188" width="44" height="22" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <!-- Cyber Coin in Gap -->
          <circle cx="22" cy="145" r="7" fill="#ffd700" stroke="#ff73fa" stroke-width="1" filter="url(#glowFlap)"/>
          <text x="22" y="148.5" text-anchor="middle" font-family="'Fira Code', monospace" font-size="8" font-weight="900" fill="#07071a">◆</text>
        </g>

        <!-- Pipe Pair 6: x = 1260. Duplicate of Pair 1 for seamless loop -->
        <g transform="translate(1260 0)">
          <!-- Top Pipe -->
          <rect x="0" y="38" width="44" height="57" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
          <rect x="-3" y="85" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <!-- Bottom Pipe -->
          <rect x="-3" y="163" width="50" height="12" rx="2" fill="url(#pipeCapGrad)" stroke="#00f0ff" stroke-width="1.2"/>
          <rect x="0" y="173" width="44" height="37" fill="url(#pipeGrad)" stroke="#00ff88" stroke-width="1.2"/>
        </g>

        <!-- Animation: Translate exactly 600px left in 6s -->
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Flappy Bird with Autonomous Flight Pattern -->
    <!-- Bird stays at x = 175. It flaps smoothly up and down to clear gaps at Y: 130 -> 105 -> 155 -> 120 -> 145 -> 130 -->
    <g transform="translate(175 0)">
      <!-- Flight Motion Path -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 130; 0 115; 0 102; 0 105; 0 120; 0 148; 0 155; 0 135; 0 118; 0 120; 0 135; 0 145; 0 130"
          keyTimes="0; 0.12; 0.22; 0.33; 0.44; 0.55; 0.65; 0.74; 0.82; 0.88; 0.93; 0.97; 1"
          dur="6s" repeatCount="indefinite"/>

        <!-- Bird Rotation (Nose up when flapping, nose down when gliding) -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-18 0 0; -24 0 0; 12 0 0; -22 0 0; 15 0 0; -20 0 0; 18 0 0; -22 0 0; 12 0 0; -20 0 0; 15 0 0; -18 0 0"
            keyTimes="0; 0.12; 0.22; 0.33; 0.44; 0.55; 0.65; 0.74; 0.82; 0.88; 0.93; 1"
            dur="6s" repeatCount="indefinite"/>

          <!-- Jet Propulsion Exhaust Particles -->
          <g filter="url(#glowFlap)" opacity="0.8">
            <circle cx="-16" cy="2" r="3" fill="#00f0ff">
              <animate attributeName="cx" values="-14;-24;-14" dur="0.4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.9;0.1;0.9" dur="0.4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="-20" cy="3" r="1.8" fill="#d946ef">
              <animate attributeName="cx" values="-18;-30;-18" dur="0.4s" begin="0.1s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.4s" begin="0.1s" repeatCount="indefinite"/>
            </circle>
          </g>

          <!-- The Cyber Bird Body -->
          <g filter="url(#birdGlow)">
            <!-- Main Oval Body (Neon Golden Yellow) -->
            <ellipse cx="0" cy="0" rx="14" ry="11" fill="#facc15" stroke="#ca8a04" stroke-width="1.2"/>
            <!-- White/Cyan Cyber Belly -->
            <path d="M-6 4 Q0 10 8 6 Q1 4 -6 4 Z" fill="#ffffff" opacity="0.9"/>
            <path d="M-6 4 Q0 10 8 6 Q1 4 -6 4 Z" fill="#00f0ff" opacity="0.35"/>
            <!-- Cyber Visor / Eye -->
            <circle cx="6" cy="-4" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
            <circle cx="7.5" cy="-4" r="2.2" fill="#00f0ff"/>
            <circle cx="8.5" cy="-5" r="0.8" fill="#ffffff"/>
            <!-- Flappy Beak (Orange) -->
            <path d="M11 -2 L18 1 L11 4 Z" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
            <line x1="11" y1="1" x2="16" y2="1" stroke="#7c2d12" stroke-width="0.8"/>
            <!-- Rosy Cheeks -->
            <circle cx="4" cy="2" r="2" fill="#ff73fa" opacity="0.7"/>

            <!-- Flapping Wing -->
            <g transform="translate(-4 0)">
              <!-- Wing Flap Animation -->
              <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="#ffffff" stroke="#ca8a04" stroke-width="1">
                <animateTransform attributeName="transform" type="rotate"
                  values="0 0 0; -35 -4 0; 25 -4 0; 0 0 0"
                  dur="0.25s" repeatCount="indefinite"/>
              </ellipse>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- Cyber Ground Bar (Scrolling hazard / circuit pattern) -->
    <g>
      <!-- Base Ground Fill -->
      <rect x="0" y="210" width="900" height="40" fill="url(#groundStripes)"/>
      <!-- Glowing Ground Border Line -->
      <line x1="0" y1="210" x2="900" y2="210" stroke="#00f0ff" stroke-width="2" filter="url(#glowFlap)"/>
      <line x1="0" y1="213" x2="900" y2="213" stroke="#00ff88" stroke-width="1" opacity="0.8"/>
      <!-- Traveling Ground Tracer -->
      <rect x="0" y="209" width="120" height="2" fill="#ffffff" opacity="0.8" filter="url(#glowFlap)">
        <animate attributeName="x" from="900" to="-120" dur="2.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>