<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550">
  <defs>
    <linearGradient id="wBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#1c2430"/>
    </linearGradient>
    <linearGradient id="wBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A8B99"/>
      <stop offset="50%" stop-color="#D3D9DF"/>
      <stop offset="100%" stop-color="#7A8B99"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="550" fill="url(#wBg)"/>
  
  <!-- Shield Outline -->
  <path d="M 20 20 L 980 20 L 980 480 L 500 530 L 20 480 Z" fill="none" stroke="url(#wBorder)" stroke-width="2"/>
  <path d="M 30 30 L 970 30 L 970 470 L 500 518 L 30 470 Z" fill="none" stroke="#4B5E6F" stroke-width="1" stroke-dasharray="10 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;36" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Title -->
  <text x="500" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" font-style="italic" fill="url(#wBorder)" letter-spacing="8">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.5s" repeatCount="indefinite"/>
    THE ARSENAL
  </text>
  <line x1="380" y1="85" x2="620" y2="85" stroke="#4B5E6F" stroke-width="1"/>

  <!-- Section 1 -->
  <text x="500" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7EB6FF" letter-spacing="4">⚔ HARDWARE &amp; EMBEDDED ⚔</text>
  <g font-family="Verdana, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <g><rect x="150" y="140" width="70" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="185" y="158" fill="#D3D9DF">C</text></g>
    <g><rect x="230" y="140" width="80" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="270" y="158" fill="#D3D9DF">C++</text></g>
    <g><rect x="320" y="140" width="95" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="367" y="158" fill="#D3D9DF">ARDUINO</text></g>
    <g><rect x="425" y="140" width="110" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="480" y="158" fill="#D3D9DF">MICROPYTHON</text></g>
    <g><rect x="545" y="140" width="70" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="580" y="158" fill="#D3D9DF">ROS</text></g>
    <g><rect x="625" y="140" width="85" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="667" y="158" fill="#D3D9DF">TINYML</text></g>
    <g><rect x="720" y="140" width="115" height="28" rx="4" fill="#1c2430" stroke="#7EB6FF" stroke-width="1.5"/><text x="777" y="158" fill="#D3D9DF">PCB DESIGN</text></g>
  </g>

  <!-- Section 2 -->
  <text x="500" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#FF8C8C" letter-spacing="4">⚔ TRADING &amp; QUANT ⚔</text>
  <g font-family="Verdana, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <g><rect x="90" y="230" width="120" height="28" rx="4" fill="#1c2430" stroke="#B22222" stroke-width="1.5"/><text x="150" y="248" fill="#D3D9DF">PINE SCRIPT</text></g>
    <g><rect x="220" y="230" width="105" height="28" rx="4" fill="#1c2430" stroke="#B22222" stroke-width="1.5"/><text x="272" y="248" fill="#D3D9DF">MQL4/5</text></g>
    <g><rect x="335" y="230" width="175" height="28" rx="4" fill="#1c2430" stroke="#B22222" stroke-width="1.5"/><text x="422" y="248" fill="#D3D9DF">ALGORITHMIC TRADING</text></g>
    <g><rect x="520" y="230" width="180" height="28" rx="4" fill="#1c2430" stroke="#B22222" stroke-width="1.5"/><text x="610" y="248" fill="#D3D9DF">QUANTITATIVE ANALYSIS</text></g>
    <g><rect x="710" y="230" width="130" height="28" rx="4" fill="#1c2430" stroke="#B22222" stroke-width="1.5"/><text x="775" y="248" fill="#D3D9DF">CRYPTO BOTS</text></g>
  </g>

  <!-- Section 3 -->
  <text x="500" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#C9A0FF" letter-spacing="4">✦ SOFTWARE &amp; AI ✦</text>
  <g font-family="Verdana, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <g><rect x="250" y="320" width="100" height="28" rx="4" fill="#1c2430" stroke="#8B5CF6" stroke-width="1.5"/><text x="300" y="338" fill="#D3D9DF">PYTHON</text></g>
    <g><rect x="360" y="320" width="80" height="28" rx="4" fill="#1c2430" stroke="#8B5CF6" stroke-width="1.5"/><text x="400" y="338" fill="#D3D9DF">FLASK</text></g>
    <g><rect x="450" y="320" width="85" height="28" rx="4" fill="#1c2430" stroke="#8B5CF6" stroke-width="1.5"/><text x="492" y="338" fill="#D3D9DF">SQLITE</text></g>
    <g><rect x="545" y="320" width="165" height="28" rx="4" fill="#1c2430" stroke="#8B5CF6" stroke-width="1.5"/><text x="627" y="338" fill="#D3D9DF">MACHINE LEARNING</text></g>
  </g>

  <!-- Section 4 -->
  <text x="500" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#6EE7B7" letter-spacing="4">🛡 SECURITY &amp; SYSTEMS 🛡</text>
  <g font-family="Verdana, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
    <g><rect x="200" y="410" width="125" height="28" rx="4" fill="#1c2430" stroke="#10B981" stroke-width="1.5"/><text x="262" y="428" fill="#D3D9DF">NETWORKING</text></g>
    <g><rect x="335" y="410" width="130" height="28" rx="4" fill="#1c2430" stroke="#10B981" stroke-width="1.5"/><text x="400" y="428" fill="#D3D9DF">DUCKY SCRIPT</text></g>
    <g><rect x="475" y="410" width="70" height="28" rx="4" fill="#1c2430" stroke="#10B981" stroke-width="1.5"/><text x="510" y="428" fill="#D3D9DF">GIT</text></g>
    <g><rect x="555" y="410" width="150" height="28" rx="4" fill="#1c2430" stroke="#10B981" stroke-width="1.5"/><text x="630" y="428" fill="#D3D9DF">HW/SW REPAIR</text></g>
  </g>

  <!-- Paw Prints Decoration with subtle lupine pulse -->
  <g fill="#7EB6FF" transform="translate(100, 500) scale(0.5)">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="3s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="8"/><circle cx="-12" cy="-12" r="5"/><circle cx="0" cy="-16" r="5"/><circle cx="12" cy="-12" r="5"/>
  </g>
  <g fill="#7EB6FF" transform="translate(900, 500) scale(0.5)">
    <animate attributeName="opacity" values="0.85;0.35;0.85" dur="3s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="8"/><circle cx="-12" cy="-12" r="5"/><circle cx="0" cy="-16" r="5"/><circle cx="12" cy="-12" r="5"/>
  </g>
</svg>