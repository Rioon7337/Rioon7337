  <g><rect x="501" y="178" width="76" height="34" rx="9" fill="#070c1f" stroke="#00e5ff" stroke-width="1.2" filter="url(#glow)"/><text x="539" y="200" text-anchor="middle" class="pill-text" fill="#cffafe">HTML5</text><rect x="501" y="178" width="76" height="34" rx="9" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" pathLength="300" stroke-dasharray="45 255"><animate attributeName="stroke-dashoffset" from="0" to="-300" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></rect></g>
  <g><rect x="591" y="178" width="68" height="34" rx="9" fill="#070c1f" stroke="#00e5ff" stroke-width="1.2" filter="url(#glow)"/><text x="625" y="200" text-anchor="middle" class="pill-text" fill="#cffafe">CSS3</text><rect x="591" y="178" width="68" height="34" rx="9" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" pathLength="300" stroke-dasharray="45 255"><animate attributeName="stroke-dashoffset" from="0" to="-300" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></rect></g>
