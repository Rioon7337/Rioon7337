  <g><rect x="484" y="322" width="92" height="34" rx="9" fill="#110820" stroke="#a855f7" stroke-width="1.2" filter="url(#glow)"/><text x="530" y="344" text-anchor="middle" class="pill-text" fill="#f5d0fe">NODE.JS</text><rect x="484" y="322" width="92" height="34" rx="9" fill="none" stroke="#d946ef" stroke-width="1.8" stroke-linecap="round" pathLength="300" stroke-dasharray="45 255"><animate attributeName="stroke-dashoffset" from="0" to="-300" dur="3.2s" begin="0.7s" repeatCount="indefinite"/></rect></g>
