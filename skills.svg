<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arsenal - Tech Stack Rioon7337">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 6px; fill: #ffffff; }
  .subtitle { font-family: 'Fira Code', ui-monospace, monospace; font-size: 11.5px; letter-spacing: 3px; fill: #00f0ff; }
  .cat { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 3px; }
  .pill-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13px; }
  .glowbar { animation: pulse 3s ease-in-out infinite; }
  .corner { stroke: #00f0ff; stroke-width: 1.6; fill: none; opacity: 0.85; stroke-linecap: round; }
  .grid { stroke: #00f0ff; stroke-opacity: 0.04; stroke-width: 1; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes drift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(12px); }
  }
  @keyframes glitch {
    0%, 94%, 100% { transform: translate(0,0); opacity: 0; }
    95% { transform: translate(-2.5px,0.8px); opacity: 0.7; }
    97% { transform: translate(2.5px,-0.8px); opacity: 0.7; }
    98.5% { transform: translate(-1.5px,0); opacity: 0.4; }
  }
  @keyframes scan {
    0% { transform: translateY(-44px); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(610px); opacity: 0; }
  }
  .ember { animation: rise linear infinite; }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 0.85; }
    85% { opacity: 0.45; }
    100% { transform: translateY(-540px); opacity: 0; }
  }
</style>

<radialGradient id="bgGradSkills" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#0a1a3e"/>
  <stop offset="55%" stop-color="#07071a"/>
  <stop offset="100%" stop-color="#050512"/>
</radialGradient>

<radialGradient id="vignetteSkills" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>

<linearGradient id="rgbBorderSkills" gradientUnits="userSpaceOnUse" x1="12" y1="300" x2="888" y2="300">
  <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="33%" stop-color="#d946ef"><animate attributeName="stop-color" values="#d946ef;#00f0ff;#ff73fa;#d946ef" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="66%" stop-color="#00ffcc"><animate attributeName="stop-color" values="#00ffcc;#ff73fa;#00f0ff;#00ffcc" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="5s" repeatCount="indefinite"/></stop>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 300" to="360 450 300" dur="4.5s" repeatCount="indefinite"/>
</linearGradient>

<linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
</linearGradient>

<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="neonInnerSkills" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur stdDeviation="2.5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="neonOuterSkills" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur stdDeviation="5.5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<clipPath id="cardClipSkills">
  <rect x="12" y="12" width="876" height="576" rx="16"/>
</clipPath>
</defs>

<!-- Outer Neon Aura -->
<rect x="12" y="12" width="876" height="576" rx="16" fill="none" stroke="url(#rgbBorderSkills)" stroke-width="5.5" opacity="0.32" filter="url(#neonOuterSkills)"/>
<rect x="12" y="12" width="876" height="576" rx="16" fill="none" stroke="url(#rgbBorderSkills)" stroke-width="2.6" opacity="0.55" filter="url(#neonInnerSkills)"/>

<!-- Dark Glass Body -->
<rect x="12" y="12" width="876" height="576" rx="16" fill="url(#bgGradSkills)"/>
<rect x="12" y="12" width="876" height="576" rx="16" fill="url(#vignetteSkills)"/>

<g clip-path="url(#cardClipSkills)">
  <g style="animation: drift 12s ease-in-out infinite;">
    <line class="grid" x1="12" y1="72" x2="888" y2="72"/>
    <line class="grid" x1="12" y1="186" x2="888" y2="186"/>
    <line class="grid" x1="12" y1="300" x2="888" y2="300"/>
    <line class="grid" x1="12" y1="414" x2="888" y2="414"/>
    <line class="grid" x1="12" y1="528" x2="888" y2="528"/>
  </g>
  <rect x="12" y="12" width="876" height="40" fill="url(#scanGrad)" style="animation: scan 5.5s linear infinite;"/>
</g>

<!-- Rotating RGB Border + Smooth Tracer -->
<rect x="12" y="12" width="876" height="576" rx="16" fill="none" stroke="url(#rgbBorderSkills)" stroke-width="1.8" opacity="0.95"/>
<rect x="12" y="12" width="876" height="576" rx="16" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" pathLength="1000" stroke-dasharray="85 915" filter="url(#neonInnerSkills)">
  <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- Cyber Corners -->
<path class="corner" d="M30 58 L30 30 L58 30" stroke="#00f0ff"/>
<path class="corner" d="M870 58 L870 30 L842 30" stroke="#00f0ff"/>
<path class="corner" d="M30 542 L30 570 L58 570" stroke="#d946ef"/>
<path class="corner" d="M870 542 L870 570 L842 570" stroke="#d946ef"/>

<!-- Main Title -->
<text x="450" y="60" text-anchor="middle" class="title" filter="url(#glow)">ARSENAL</text>
<text x="450" y="80" text-anchor="middle" class="subtitle">// TECH STACK MATRIX &#183; RIOON7337</text>
<rect class="glowbar" x="350" y="88" width="200" height="2" rx="1" fill="url(#rgbBorderSkills)" filter="url(#glow)"/>
<text x="448" y="60" text-anchor="middle" class="title" fill="#00f0ff" style="animation: glitch 6.5s infinite; opacity:0;">ARSENAL</text>
<text x="452" y="60" text-anchor="middle" class="title" fill="#d946ef" style="animation: glitch 6.5s infinite .12s; opacity:0;">ARSENAL</text>

