<svg xmlns="http://www.w3.org/2000/svg" width="600" height="90" viewBox="0 0 600 90" role="img" aria-label="Click Here If You Interested In Me UwU">
  <defs>
    <style>
      .btn-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 900; letter-spacing: 2px; fill: #ffffff; }
      .btn-sub { font-family: 'Fira Code', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; fill: #ff73fa; }
      .btn-tag { font-family: 'Fira Code', monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 2px; fill: #00ffcc; }
      @keyframes portalPulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
      @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes scanSweep {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(600px); }
      }
      @keyframes chevronPulse {
        0%, 100% { opacity: 0.3; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(4px); }
      }
    </style>

    <radialGradient id="btnBg" cx="50%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#0a1e48"/>
      <stop offset="60%" stop-color="#070c24"/>
      <stop offset="100%" stop-color="#040614"/>
    </radialGradient>

    <linearGradient id="rgbBorderBtn" gradientUnits="userSpaceOnUse" x1="6" y1="45" x2="594" y2="45">
      <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="4.5s" repeatCount="indefinite"/></stop>
      <stop offset="33%" stop-color="#d946ef"><animate attributeName="stop-color" values="#d946ef;#00f0ff;#ff73fa;#d946ef" dur="4.5s" repeatCount="indefinite"/></stop>
      <stop offset="66%" stop-color="#00ffcc"><animate attributeName="stop-color" values="#00ffcc;#ff73fa;#00f0ff;#00ffcc" dur="4.5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="4.5s" repeatCount="indefinite"/></stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 300 45" to="360 300 45" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="btnGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#00f0ff" stroke-width="0.35" opacity="0.08"/>
    </pattern>

    <linearGradient id="btnSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="btnClip">
      <path d="M 22 6 L 578 6 L 594 22 L 594 68 L 578 84 L 22 84 L 6 68 L 6 22 Z"/>
    </clipPath>
  </defs>

  <!-- Outer Neon Aura -->
  <path d="M 22 6 L 578 6 L 594 22 L 594 68 L 578 84 L 22 84 L 6 68 L 6 22 Z" fill="none" stroke="url(#rgbBorderBtn)" stroke-width="4.5" opacity="0.35" filter="url(#btnGlow)"/>

  <!-- Card Body -->
  <path d="M 22 6 L 578 6 L 594 22 L 594 68 L 578 84 L 22 84 L 6 68 L 6 22 Z" fill="url(#btnBg)"/>
  <rect x="6" y="6" width="588" height="78" fill="url(#btnGrid)" clip-path="url(#btnClip)"/>

  <!-- Scanning Light Sweep -->
  <g clip-path="url(#btnClip)">
    <rect x="-600" y="0" width="600" height="90" fill="url(#btnSweep)" style="animation: scanSweep 4s linear infinite;"/>
  </g>

  <!-- Rotating Border & Dash Tracer -->
  <path d="M 22 6 L 578 6 L 594 22 L 594 68 L 578 84 L 22 84 L 6 68 L 6 22 Z" fill="none" stroke="url(#rgbBorderBtn)" stroke-width="1.8" opacity="0.95"/>
  <path d="M 22 6 L 578 6 L 594 22 L 594 68 L 578 84 L 22 84 L 6 68 L 6 22 Z" fill="none" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" opacity="0.9" pathLength="1000" stroke-dasharray="90 910" filter="url(#btnGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="3.8s" repeatCount="indefinite"/>
  </path>

  <!-- Cyber Corners -->
  <g stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.95">
    <path d="M12 32 L12 18 L18 12 L32 12"/>
    <path d="M588 32 L588 18 L582 12 L568 12"/>
  </g>
  <g stroke="#d946ef" stroke-width="1.8" fill="none" opacity="0.95">
    <path d="M12 58 L12 72 L18 78 L32 78"/>
    <path d="M588 58 L588 72 L582 78 L568 78"/>
  </g>

  <!-- Left Icon: Holographic Cyber Core -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#06163a" stroke="#00f0ff" stroke-width="1.3"/>
    <circle cx="20" cy="20" r="13" fill="none" stroke="#d946ef" stroke-width="1.2" stroke-dasharray="4 2"/>
    <circle cx="20" cy="20" r="6" fill="#00f0ff" opacity="0.75" filter="url(#btnGlow)">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Crosshairs -->
    <line x1="7" y1="20" x2="33" y2="20" stroke="#00ffcc" stroke-width="0.8" opacity="0.6"/>
    <line x1="20" y1="7" x2="20" y2="33" stroke="#00ffcc" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Center Content -->
  <g transform="translate(86, 0)">
    <!-- Top Telemetry Tag -->
    <g transform="translate(0, 25)">
      <circle cx="4" cy="-2.5" r="2.5" fill="#00ff88" style="animation: blinkDot 1.4s infinite;"/>
      <text x="14" y="1" class="btn-tag">&lt;DIRECT NEURAL UPLINK // RIOON7337&gt;</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="48" class="btn-title" filter="url(#btnGlow)">Click Here If You Interested In Me UwU</text>

    <!-- Subtitle -->
    <text x="0" y="67" class="btn-sub">&gt;&gt; LAUNCH ARSENAL &#183; ARCADE GAMES &#183; MUSIC CINEMA &#183; CONNECT &lt;&lt;</text>
  </g>

  <!-- Right Decorative Cyber Chevron Indicator -->
  <g transform="translate(548, 36)" stroke="#00ffcc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="animation: chevronPulse 1.8s ease-in-out infinite;">
    <path d="M0 0 L8 9 L0 18"/>
    <path d="M9 0 L17 9 L9 18" stroke="#ff73fa" opacity="0.7"/>
  </g>
</svg>