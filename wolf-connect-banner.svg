<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <defs>
    <linearGradient id="wcBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#182232"/>
    </linearGradient>

    <linearGradient id="wcSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A8B99"/>
      <stop offset="50%" stop-color="#D3D9DF"/>
      <stop offset="100%" stop-color="#7A8B99"/>
    </linearGradient>

    <linearGradient id="wcGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="cBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="140" rx="12" fill="url(#wcBg)"/>

  <!-- Floating Arcane Motes -->
  <g filter="url(#cBloom)">
    <circle cx="200" cy="100" r="1.5" fill="#38bdf8">
      <animate attributeName="cy" values="100;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="110" r="1.5" fill="#fbbf24">
      <animate attributeName="cy" values="110;40" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Frame -->
  <path d="M 20 20 L 880 20 L 880 120 L 20 120 Z" fill="none" stroke="url(#wcSteel)" stroke-width="2"/>
  <path d="M 28 28 L 872 28 L 872 112 L 28 112 Z" fill="none" stroke="#4B5E6F" stroke-width="1" stroke-dasharray="6 6" opacity="0.75">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Corner Rivets -->
  <circle cx="24" cy="24" r="2.5" fill="#f59e0b"/>
  <circle cx="876" cy="24" r="2.5" fill="#f59e0b"/>
  <circle cx="24" cy="116" r="2.5" fill="#f59e0b"/>
  <circle cx="876" cy="116" r="2.5" fill="#f59e0b"/>

  <!-- Left Medieval Knight Shield Crest (NO PAWS) -->
  <g transform="translate(120, 70)" stroke="url(#wcSteel)" fill="none" stroke-width="2">
    <!-- Hexagonal Knight Escutcheon -->
    <path d="M 0 -22 L 18 -12 L 18 10 L 0 22 L -18 10 L -18 -12 Z" fill="#151e2c"/>
    <!-- Crossed Mini Broadswords -->
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#cbd5e1" stroke-width="1.8"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#cbd5e1" stroke-width="1.8"/>
    <!-- Crossguard bars -->
    <line x1="-12" y1="-6" x2="-6" y2="-12" stroke="#fbbf24" stroke-width="2"/>
    <line x1="12" y1="-6" x2="6" y2="-12" stroke="#fbbf24" stroke-width="2"/>
    <!-- Glowing Center Gemstone -->
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" stroke="#fbbf24" stroke-width="1" filter="url(#cBloom)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right Medieval Knight Shield Crest (NO PAWS) -->
  <g transform="translate(780, 70)" stroke="url(#wcSteel)" fill="none" stroke-width="2">
    <!-- Hexagonal Knight Escutcheon -->
    <path d="M 0 -22 L 18 -12 L 18 10 L 0 22 L -18 10 L -18 -12 Z" fill="#151e2c"/>
    <!-- Crossed Mini Broadswords -->
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#cbd5e1" stroke-width="1.8"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#cbd5e1" stroke-width="1.8"/>
    <!-- Crossguard bars -->
    <line x1="-12" y1="-6" x2="-6" y2="-12" stroke="#fbbf24" stroke-width="2"/>
    <line x1="12" y1="-6" x2="6" y2="-12" stroke="#fbbf24" stroke-width="2"/>
    <!-- Glowing Center Gemstone -->
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" stroke="#fbbf24" stroke-width="1" filter="url(#cBloom)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title: CONNECT -->
  <text x="450" y="62" text-anchor="middle"
        font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="38" font-weight="bold" font-style="italic"
        fill="url(#wcGold)" letter-spacing="12">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    ⚔ CONNECT ⚔
  </text>

  <!-- Subtitle -->
  <text x="450" y="92" text-anchor="middle"
        font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="bold" fill="#D3D9DF" letter-spacing="4">
    // FORGE ALLIANCES ACROSS THE REALM — RIOON7337
  </text>

  <!-- Divider -->
  <line x1="160" y1="108" x2="740" y2="108" stroke="#4B5E6F" stroke-width="1"/>
  <!-- Central Heraldic Diamond Jewel -->
  <polygon points="450,103 455,108 450,113 445,108" fill="#fbbf24" filter="url(#cBloom)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="160" cy="108" r="2.5" fill="#38bdf8"/>
  <circle cx="740" cy="108" r="2.5" fill="#38bdf8"/>
</svg>