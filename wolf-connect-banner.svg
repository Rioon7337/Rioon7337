<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 145" width="900" height="145">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04070e"/>
      <stop offset="50%" stop-color="#0b121e"/>
      <stop offset="100%" stop-color="#10192a"/>
    </linearGradient>

    <!-- Gold & Steel Gradients -->
    <linearGradient id="portalGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="portalSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Swirling Vortex Gradient -->
    <radialGradient id="vortexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="portalBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="145" rx="14" fill="url(#portalBg)"/>

  <!-- ==================== FLOATING ARCANE EMBERS & PARTICLES ==================== -->
  <g filter="url(#portalBloom)">
    <circle cx="180" cy="110" r="1.5" fill="#38bdf8">
      <animate attributeName="cy" values="110;25" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="115" r="1.5" fill="#fbbf24">
      <animate attributeName="cy" values="115;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="120" r="1.2" fill="#c084fc">
      <animate attributeName="cy" values="120;35" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="120" r="1.2" fill="#38bdf8">
      <animate attributeName="cy" values="120;35" dur="3.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Outer Great Frame with Gold Trim -->
  <path d="M 18 18 L 882 18 L 882 127 L 18 127 Z" fill="none" stroke="url(#portalGold)" stroke-width="2" opacity="0.9"/>
  <!-- Energy Pulse Traversing Outer Frame -->
  <path d="M 18 18 L 882 18 L 882 127 L 18 127 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="50 250" opacity="0.85" filter="url(#portalBloom)">
    <animate attributeName="stroke-dashoffset" values="300;0" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <!-- Inner Runic Dashline Frame -->
  <path d="M 26 26 L 874 26 L 874 119 L 26 119 Z" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Corner Rivets -->
  <circle cx="22" cy="22" r="2.8" fill="#f59e0b"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="878" cy="22" r="2.8" fill="#f59e0b"><animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="22" cy="123" r="2.8" fill="#f59e0b"><animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="878" cy="123" r="2.8" fill="#f59e0b"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- ==================== LEFT ANCIENT OBELISK & LEVITATING ORB ==================== -->
  <g transform="translate(100, 72)">
    <!-- Obelisk Base Pedestal -->
    <polygon points="-22,32 22,32 16,-2 -16,-2" fill="#151e2c" stroke="url(#portalGold)" stroke-width="1.5"/>
    <polygon points="-16,-2 16,-2 10,-24 -10,-24" fill="#0f172a" stroke="url(#portalSteel)" stroke-width="1.2"/>
    <!-- Glowing Runes on Obelisk Face -->
    <line x1="0" y1="26" x2="0" y2="4" stroke="#38bdf8" stroke-width="2" filter="url(#portalBloom)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Levitating Crystal Orb above Obelisk Spire -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-32; 0,-38; 0,-32" dur="2.8s" repeatCount="indefinite"/>
      <!-- Expanding Magic Wave from Orb -->
      <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" filter="url(#softBloom)">
        <animate attributeName="r" values="8;20;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Crystal Orb Core -->
      <circle cx="0" cy="0" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" filter="url(#portalBloom)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ==================== RIGHT ANCIENT OBELISK & LEVITATING ORB ==================== -->
  <g transform="translate(800, 72)">
    <!-- Obelisk Base Pedestal -->
    <polygon points="-22,32 22,32 16,-2 -16,-2" fill="#151e2c" stroke="url(#portalGold)" stroke-width="1.5"/>
    <polygon points="-16,-2 16,-2 10,-24 -10,-24" fill="#0f172a" stroke="url(#portalSteel)" stroke-width="1.2"/>
    <!-- Glowing Runes on Obelisk Face -->
    <line x1="0" y1="26" x2="0" y2="4" stroke="#fbbf24" stroke-width="2" filter="url(#portalBloom)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- Levitating Crystal Orb above Obelisk Spire -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-32; 0,-38; 0,-32" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      <!-- Expanding Magic Wave from Orb -->
      <circle cx="0" cy="0" r="12" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6" filter="url(#softBloom)">
        <animate attributeName="r" values="8;20;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Crystal Orb Core -->
      <circle cx="0" cy="0" r="8" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2" filter="url(#portalBloom)">
        <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ==================== CENTER TITLE: GUILD CONVERGENCE ==================== -->
  <g transform="translate(450, 62)">
    <!-- Title Text -->
    <text x="0" y="0" text-anchor="middle"
          font-family="'Cinzel', 'Palatino Linotype', 'Georgia', serif" font-size="38" font-weight="900" font-style="italic"
          fill="url(#portalGold)" letter-spacing="12">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
      ⚔ CONVERGENCE ⚔
    </text>

    <!-- Subtitle: High Fantasy Transmission Line -->
    <text x="0" y="32" text-anchor="middle"
          font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="bold" fill="#D3D9DF" letter-spacing="4">
      ✧ TRANSMIT SIGNALS ACROSS THE DIGITAL REALMS — RIOON7337 ✧
    </text>
  </g>

  <!-- Divider Line with Magic Shockwave -->
  <g transform="translate(450, 114)">
    <line x1="-280" y1="0" x2="-20" y2="0" stroke="#475569" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="280" y2="0" stroke="#475569" stroke-width="1.2"/>
    <!-- Center Heraldic Relic Star -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#38bdf8" filter="url(#portalBloom)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    <!-- Side Nodes -->
    <circle cx="-280" cy="0" r="2.5" fill="#38bdf8"/>
    <circle cx="280" cy="0" r="2.5" fill="#38bdf8"/>
  </g>
</svg>