<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="300" height="90">
  <defs>
    <!-- Card Border Gradient -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706">
        <animate attributeName="stop-color" values="#d97706;#fef08a;#d97706" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#38bdf8;#ffffff" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b45309">
        <animate attributeName="stop-color" values="#b45309;#f59e0b;#b45309" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <path d="M 12 2 L 288 2 L 298 12 L 298 78 L 288 88 L 12 88 L 2 78 L 2 12 Z"
        fill="#0b1019" stroke="url(#cardGold)" stroke-width="2"/>

  <!-- Energy Pulse Traversing Card Border -->
  <path d="M 12 2 L 288 2 L 298 12 L 298 78 L 288 88 L 12 88 L 2 78 L 2 12 Z"
        fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="35 150" opacity="0.8" filter="url(#badgeGlow)">
    <animate attributeName="stroke-dashoffset" values="185;0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Inner Runic Dashline -->
  <path d="M 16 6 L 284 6 L 294 16 L 294 74 L 284 84 L 16 84 L 6 74 L 6 16 Z"
        fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Floating Mana Sparks inside card -->
  <g filter="url(#badgeGlow)">
    <circle cx="120" cy="70" r="1.2" fill="#38bdf8">
      <animate attributeName="cy" values="70;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="65" r="1.2" fill="#fbbf24">
      <animate attributeName="cy" values="65;15" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner Rivets -->
  <g fill="#f59e0b" filter="url(#badgeGlow)">
    <circle cx="12" cy="12" r="2.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="288" cy="12" r="2.5"><animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="12" cy="78" r="2.5"><animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="288" cy="78" r="2.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ==================== ROTATING MINI RUNE CIRCLE BEHIND SHIELD ==================== -->
  <g transform="translate(45, 45)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.6" filter="url(#badgeGlow)"/>
    </g>
  </g>

  <!-- Icon Shield Escutcheon -->
  <path d="M 30 25 L 60 25 L 60 55 L 45 68 L 30 55 Z" fill="#131b28" stroke="url(#cardGold)" stroke-width="1.8"/>

  <!-- X Icon -->
  <g stroke="#F2C94C" stroke-width="2.2" stroke-linecap="round">
    <line x1="38" y1="36" x2="52" y2="50"/>
    <line x1="52" y1="36" x2="38" y2="50"/>
  </g>

  <!-- Platform Name -->
  <text x="80" y="42"
        font-family="'Cinzel', 'Georgia', serif" font-size="16" font-weight="900"
        fill="url(#textGold)" letter-spacing="2">
    X / TWITTER
  </text>

  <!-- ==================== STATUS BEACON (MULTI-RING RADAR) ==================== -->
  <g transform="translate(83, 60)">
    <!-- Core Dot -->
    <circle cx="0" cy="0" r="3.2" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Radar Wave 1 -->
    <circle cx="0" cy="0" r="5" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.7">
      <animate attributeName="r" values="3.2;8;3.2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Radar Wave 2 -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#22c55e" stroke-width="0.6" opacity="0.4">
      <animate attributeName="r" values="3.2;12;3.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="96" y="64"
        font-family="Verdana, sans-serif" font-size="9" font-weight="bold"
        fill="#94a3b8" letter-spacing="2">
    CONNECTED
  </text>

  <!-- ==================== ANIMATED ENCHANTED CRYSTAL DAGGER / QUEST ARROW ==================== -->
  <g transform="translate(268, 45)">
    <animateTransform attributeName="transform" type="translate" values="264,45; 272,45; 264,45" dur="1.6s" repeatCount="indefinite"/>
    <!-- Outer Chevron Blade -->
    <path d="M -7 -11 L 4 0 L -7 11 L -4 11 L 7 0 L -4 -11 Z" fill="url(#cardGold)"/>
    <!-- Inner Radiant Crystal Spine -->
    <polygon points="-1,-5 4,0 -1,5 -3,0" fill="#38bdf8" filter="url(#badgeGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="5" cy="0" r="1.5" fill="#ffffff"/>
  </g>
</svg>