<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#07071a"/>
      <stop offset="50%"  stop-color="#0d1a3e"/>
      <stop offset="100%" stop-color="#07071a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#00f0ff"/>
      <stop offset="80%"  stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hgrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#00f0ff" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="900" height="120" fill="url(#hb)" rx="12"/>
  <rect width="900" height="120" fill="url(#hgrid)" rx="12"/>

  <!-- Cyber Corners -->
  <path d="M20 35 L20 18 L37 18" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.85"/>
  <path d="M880 35 L880 18 L863 18" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.85"/>
  <path d="M20 85 L20 102 L37 102" stroke="#d946ef" stroke-width="1.8" fill="none" opacity="0.85"/>
  <path d="M880 85 L880 102 L863 102" stroke="#d946ef" stroke-width="1.8" fill="none" opacity="0.85"/>

  <g filter="url(#hglow)">
    <text x="450.0" y="52" text-anchor="middle"
          font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace"
          font-size="30" font-weight="800" letter-spacing="9" fill="#00f0ff">CONNECT</text>
  </g>

  <text x="450.0" y="78" text-anchor="middle"
        font-family="'Fira Code',ui-monospace,monospace"
        font-size="12" letter-spacing="4" fill="#ff73fa">
    // ESTABLISHING QUANTUM UPLINK &#8212; RIOON7337
  </text>

  <rect x="80" y="94" width="740" height="1.6" fill="url(#rule)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g fill="#00f0ff" filter="url(#hglow)">
    <circle cx="150.0" cy="94.8" r="2.6">
      <animate attributeName="cx" values="150.0;750.0;150.0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#d946ef" filter="url(#hglow)">
    <circle cx="750.0" cy="94.8" r="2.2">
      <animate attributeName="cx" values="750.0;150.0;750.0" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>