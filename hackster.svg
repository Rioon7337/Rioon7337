<svg xmlns="http://www.w3.org/2000/svg" width="260" height="78" viewBox="0 0 260 78" role="img" aria-label="HACKSTER">
  <defs>
    <style>
      .card-edge { transition: stroke-width 0.2s, stroke 0.2s, opacity 0.2s; }
      .lbl-text { transition: fill 0.2s, text-shadow 0.2s; }
      .chev-arr { transition: transform 0.2s, stroke 0.2s; }
      .card-body { transition: fill 0.2s; }
      :root:hover .card-edge {
        stroke-width: 2.4px;
        opacity: 1;
        filter: url(#glow_hackster);
      }
      :root:hover .lbl-text {
        fill: #ffffff;
        text-shadow: 0 0 10px #00ffcc;
      }
      :root:hover .chev-arr {
        transform: translate(228px, 34px);
      }
      :root:active .card-body {
        fill: #0c1c44;
      }
      :root:active .card-edge {
        stroke: #00ff88;
        stroke-width: 2.8px;
        opacity: 1;
      }
      :root:active .lbl-text {
        fill: #00ff88;
        text-shadow: 0 0 14px #00ff88;
      }
      :root:active .chev-arr {
        stroke: #00ff88;
        transform: translate(232px, 34px);
      }
    </style>

    <linearGradient id="bg_hackster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a1c"/>
      <stop offset="60%" stop-color="#071330"/>
      <stop offset="100%" stop-color="#040614"/>
    </linearGradient>

    <linearGradient id="edge_hackster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>

    <filter id="glow_hackster" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid_hackster" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#00ffcc" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <linearGradient id="sweep_hackster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00ffcc" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </linearGradient>

    <!-- Chamfered Keycard Clip -->
    <clipPath id="clip_hackster">
      <path d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <path class="card-body" d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z" fill="url(#bg_hackster)"/>
  <rect x="2" y="2" width="256" height="74" fill="url(#grid_hackster)" clip-path="url(#clip_hackster)"/>

  <!-- Glowing Edge Border -->
  <path class="card-edge" d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z"
        fill="none" stroke="url(#edge_hackster)" stroke-width="1.6" opacity="0.9" filter="url(#glow_hackster)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Traveling Dash Sweep -->
  <path d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z"
        fill="none" stroke="#00ffcc" stroke-width="2" stroke-linecap="round" pathLength="600" stroke-dasharray="60 540">
    <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- Light Sweep Effect -->
  <g clip-path="url(#clip_hackster)">
    <rect x="-260" y="0" width="260" height="78" fill="url(#sweep_hackster)">
      <animate attributeName="x" from="-260" to="260" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Cyber Corners -->
  <g stroke="#00ffcc" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M7 24 L7 16 L16 7 L24 7"/>
    <path d="M253 24 L253 16 L244 7 L236 7"/>
    <path d="M7 54 L7 62 L16 71 L24 71"/>
    <path d="M253 54 L253 62 L244 71 L236 71"/>
  </g>

  <!-- Icon Chamber (Left Side) -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#06122c" stroke="#00ffcc" stroke-width="1.2" opacity="0.9"/>
    <g transform="translate(6, 6)"><path d="M4 4h4v6.5h7V4h4v15h-4v-5.5h-7V19H4V4z" fill="#00ffcc"/></g>
  </g>

  <!-- Node Code Identifier -->
  <text x="64" y="24" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#00ffcc">NODE.05 // HACKSTER</text>

  <!-- Main Platform Label -->
  <text class="lbl-text" x="64" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#glow_hackster)">HACKSTER</text>

  <!-- Status Telemetry Line -->
  <g transform="translate(64, 58)">
    <circle cx="4" cy="-3.5" r="2.5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="0" font-family="'Fira Code', monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#00ffcc">IOT_CORE // ARMED</text>
  </g>

  <!-- Cyber Navigation Chevron >>> -->
  <g class="chev-arr" stroke="#d946ef" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(224, 34)">
    <path d="M0 0 L5 5 L0 10">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M6 0 L11 5 L6 10" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>