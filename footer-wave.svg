<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Thanks For Visiting - Rioon7337">
  <defs>
    <radialGradient id="bgWave" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="50%" stop-color="#0e0606"/>
      <stop offset="100%" stop-color="#020103"/>
    </radialGradient>

    <!-- Amber to Crimson Dual Fire Wave Gradient -->
    <linearGradient id="fireWave" gradientUnits="userSpaceOnUse" x1="20" y1="90" x2="880" y2="90">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="18%" stop-color="#dc2626">
        <animate attributeName="stop-color" values="#dc2626;#f5a623;#ff73fa;#f5a623;#dc2626" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f5a623">
        <animate attributeName="stop-color" values="#f5a623;#ffb347;#dc2626;#ffb347;#f5a623" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="82%" stop-color="#dc2626">
        <animate attributeName="stop-color" values="#dc2626;#ef4444;#f5a623;#ef4444;#dc2626" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="frameGradWave" gradientUnits="userSpaceOnUse" x1="12" y1="90" x2="888" y2="90">
      <stop offset="0%" stop-color="#f5a623">
        <animate attributeName="stop-color" values="#f5a623;#dc2626;#f5a623" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#dc2626">
        <animate attributeName="stop-color" values="#dc2626;#f5a623;#dc2626" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f5a623">
        <animate attributeName="stop-color" values="#f5a623;#dc2626;#f5a623" dur="5s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 90" to="360 450 90" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glowWave" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="neonOuterWave" x="-10%" y="-25%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="gridWave" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#f5a623" stroke-width="0.35" opacity="0.04"/>
    </pattern>

    <clipPath id="waveClip">
      <rect x="12" y="12" width="876" height="156" rx="14"/>
    </clipPath>
  </defs>

  <!-- Outer Neon Glow -->
  <rect x="12" y="12" width="876" height="156" rx="14" fill="none" stroke="url(#frameGradWave)" stroke-width="4" opacity="0.28" filter="url(#neonOuterWave)"/>

  <!-- Dark Obsidian Card Background -->
  <rect x="12" y="12" width="876" height="156" rx="14" fill="url(#bgWave)"/>
  <rect x="12" y="12" width="876" height="156" rx="14" fill="url(#gridWave)"/>

  <!-- Cyber Corners (Matching Hero & Skills) -->
  <path d="M22 42 L22 22 L42 22" stroke="#f5a623" stroke-width="2" fill="none" opacity=".8"/>
  <path d="M878 42 L878 22 L858 22" stroke="#f5a623" stroke-width="2" fill="none" opacity=".8"/>
  <path d="M22 138 L22 158 L42 158" stroke="#f5a623" stroke-width="2" fill="none" opacity=".8"/>
  <path d="M878 138 L878 158 L858 158" stroke="#f5a623" stroke-width="2" fill="none" opacity=".8"/>

  <!-- Flowing Dual Fire Sine Waves -->
  <g clip-path="url(#waveClip)">
    <g>
      <!-- Primary Wave (Golden Crimson) -->
      <path d="M-300 95 Q-225 52 -150 95 T0 95 T150 95 T300 95 T450 95 T600 95 T750 95 T900 95 T1050 95 T1200 95"
            fill="none" stroke="url(#fireWave)" stroke-width="2.6" filter="url(#glowWave)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- Secondary Counter Wave (Subtle Amber) -->
      <path d="M-300 95 Q-225 138 -150 95 T0 95 T150 95 T300 95 T450 95 T600 95 T750 95 T900 95 T1050 95 T1200 95"
            fill="none" stroke="url(#fireWave)" stroke-width="1.6" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" from="-300 0" to="0 0" dur="5.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Floating Fire Embers / Motes -->
    <circle cx="140" cy="48" r="1.5" fill="#f5a623" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="52;44;52" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="136" r="1.6" fill="#dc2626" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;132;140" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="44" r="1.4" fill="#ffb347" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="138" r="1.5" fill="#f5a623" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Border -->
  <rect x="12" y="12" width="876" height="156" rx="14" fill="none" stroke="url(#frameGradWave)" stroke-width="1.6" opacity="0.85"/>

  <!-- Traveling Border Light Tracer -->
  <rect x="12" y="12" width="876" height="156" rx="14" fill="none" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round" opacity="0.8" pathLength="1000" stroke-dasharray="60 940">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Centered Footer Typography -->
  <text x="450" y="86" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="18" font-weight="800" letter-spacing="5" fill="#ffffff" filter="url(#glowWave)">
    THANKS FOR VISITING
  </text>
  <text x="450" y="112" text-anchor="middle"
        font-family="'Fira Code', ui-monospace, monospace"
        font-size="12" font-weight="600" letter-spacing="3" fill="#f5a623">
    // KEEP BUILDING &#183; RIOON7337
  </text>
</svg>
