<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Thanks For Visiting - Rioon7337">
  <defs>
    <style>
      .ft-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 8px; fill: #ffffff; }
      .ft-sub { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: 600; letter-spacing: 3px; fill: #00f0ff; }
      .ft-tag { font-family: 'Fira Code', monospace; font-size: 7.5px; font-weight: 700; letter-spacing: 1.5px; }
      @keyframes glitchFt {
        0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
        93% { transform: translate(-2px, 0.5px); opacity: 0.7; }
        95% { transform: translate(2px, -0.5px); opacity: 0.7; }
        97% { transform: translate(-1px, 0); opacity: 0.35; }
      }
      @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes fadeBreath { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      @keyframes lineSweep {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1000; }
      }
      @keyframes scanDown {
        0% { transform: translateY(-20px); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes dataRise {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.6; }
        80% { opacity: 0.3; }
        100% { transform: translateY(-140px); opacity: 0; }
      }
      @keyframes hexPulse {
        0%, 100% { transform: scale(1); opacity: 0.15; }
        50% { transform: scale(1.15); opacity: 0.35; }
      }
      @keyframes ringExpand {
        0% { r: 2; opacity: 0.6; }
        100% { r: 18; opacity: 0; }
      }
    </style>

    <radialGradient id="bgFt" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0a1a3e"/>
      <stop offset="60%" stop-color="#07071a"/>
      <stop offset="100%" stop-color="#04040e"/>
    </radialGradient>

    <linearGradient id="frameFt" gradientUnits="userSpaceOnUse" x1="12" y1="90" x2="888" y2="90">
      <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#d946ef;#00ffcc;#00f0ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#d946ef"><animate attributeName="stop-color" values="#d946ef;#00ffcc;#00f0ff;#d946ef" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#00ffcc"><animate attributeName="stop-color" values="#00ffcc;#00f0ff;#d946ef;#00ffcc" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>

    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanbeam" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowFt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="ftClip">
      <path d="M 24 8 L 876 8 L 892 24 L 892 156 L 876 172 L 24 172 L 8 156 L 8 24 Z"/>
    </clipPath>
  </defs>

  <!-- Outer Glow -->
  <path d="M 24 8 L 876 8 L 892 24 L 892 156 L 876 172 L 24 172 L 8 156 L 8 24 Z"
        fill="none" stroke="url(#frameFt)" stroke-width="4" opacity="0.2" filter="url(#glowFt)"/>

  <!-- Body -->
  <path d="M 24 8 L 876 8 L 892 24 L 892 156 L 876 172 L 24 172 L 8 156 L 8 24 Z" fill="url(#bgFt)"/>

  <!-- Subtle dot grid -->
  <g clip-path="url(#ftClip)" opacity="0.04">
    <pattern id="dotsFt" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#00f0ff"/>
    </pattern>
    <rect x="8" y="8" width="884" height="164" fill="url(#dotsFt)"/>
  </g>

  <!-- Subtle Futuristic Ambient Animations -->
  <g clip-path="url(#ftClip)">
    <!-- Moving Laser Scanbeam -->
    <rect x="8" y="0" width="884" height="25" fill="url(#scanbeam)" style="animation: scanDown 6s ease-in-out infinite; pointer-events: none;"/>

    <!-- Subtle Center Divider Wire with Pulsing Signal -->
    <line x1="160" y1="90" x2="740" y2="90" stroke="url(#dividerGrad)" stroke-width="0.7" opacity="0.4"/>
    <circle cx="450" cy="90" r="1.5" fill="#00ffcc">
      <animate attributeName="cx" values="180;720;180" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Ambient Rising Cyber Data Bits -->
    <g opacity="0.5">
      <circle cx="210" cy="160" r="1.2" fill="#00f0ff" style="animation: dataRise 4.5s linear infinite;"/>
      <circle cx="280" cy="170" r="1" fill="#d946ef" style="animation: dataRise 5.5s linear infinite 1.8s;"/>
      <circle cx="620" cy="165" r="1" fill="#00ffcc" style="animation: dataRise 5s linear infinite 0.9s;"/>
      <circle cx="700" cy="170" r="1.2" fill="#00f0ff" style="animation: dataRise 5.8s linear infinite 2.5s;"/>
    </g>

    <!-- Left Flank Telemetry Node -->
    <g transform="translate(115, 85)" opacity="0.75">
      <!-- Expanding radar ping ring -->
      <circle cx="0" cy="0" r="4" fill="none" stroke="#00f0ff" stroke-width="0.8">
        <animate attributeName="r" values="2;15" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2" fill="#00ff88"/>
      <!-- HUD bracket & label -->
      <path d="M-12 -12 L-18 -12 L-18 12 L-12 12" fill="none" stroke="#00f0ff" stroke-width="1"/>
      <text x="-22" y="3" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" fill="#00f0ff" opacity="0.55" text-anchor="end">NODE.01</text>
      <!-- Mini audio-frequency equalizer levels -->
      <line x1="8" y1="-4" x2="8" y2="4" stroke="#00f0ff" stroke-width="1.2">
        <animate attributeName="y1" values="-2;-7;-3;-2" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="2;7;3;2" dur="1.3s" repeatCount="indefinite"/>
      </line>
      <line x1="13" y1="-2" x2="13" y2="2" stroke="#00ffcc" stroke-width="1.2">
        <animate attributeName="y1" values="-4;-1;-6;-4" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="4;1;6;4" dur="1.7s" repeatCount="indefinite"/>
      </line>
      <line x1="18" y1="-5" x2="18" y2="5" stroke="#d946ef" stroke-width="1.2">
        <animate attributeName="y1" values="-1;-6;-3;-1" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="1;6;3;1" dur="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Right Flank Telemetry Node -->
    <g transform="translate(785, 85)" opacity="0.75">
      <!-- Expanding radar ping ring -->
      <circle cx="0" cy="0" r="4" fill="none" stroke="#d946ef" stroke-width="0.8">
        <animate attributeName="r" values="2;15" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2" fill="#d946ef"/>
      <!-- HUD bracket & label -->
      <path d="M12 -12 L18 -12 L18 12 L12 12" fill="none" stroke="#d946ef" stroke-width="1"/>
      <text x="22" y="3" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" fill="#d946ef" opacity="0.55">NODE.02</text>
      <!-- Mini audio-frequency equalizer levels -->
      <line x1="-18" y1="-5" x2="-18" y2="5" stroke="#d946ef" stroke-width="1.2">
        <animate attributeName="y1" values="-1;-6;-3;-1" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="1;6;3;1" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="-13" y1="-2" x2="-13" y2="2" stroke="#00ffcc" stroke-width="1.2">
        <animate attributeName="y1" values="-4;-1;-6;-4" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="4;1;6;4" dur="1.7s" repeatCount="indefinite"/>
      </line>
      <line x1="-8" y1="-4" x2="-8" y2="4" stroke="#00f0ff" stroke-width="1.2">
        <animate attributeName="y1" values="-2;-7;-3;-2" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="2;7;3;2" dur="1.3s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- Chamfered Corners -->
  <g stroke="#00f0ff" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M14 38 L14 22 L22 14 L38 14"/>
    <path d="M886 38 L886 22 L878 14 L862 14"/>
  </g>
  <g stroke="#d946ef" stroke-width="1.6" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M14 142 L14 158 L22 166 L38 166"/>
    <path d="M886 142 L886 158 L878 166 L862 166"/>
  </g>

  <!-- Minimal side notches -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.3">
    <line x1="8" y1="60" x2="16" y2="60"/>
    <line x1="8" y1="120" x2="16" y2="120"/>
    <line x1="884" y1="60" x2="892" y2="60"/>
    <line x1="884" y1="120" x2="892" y2="120"/>
  </g>

  <!-- Top status tag -->
  <text x="36" y="30" class="ft-tag" fill="#00ffcc" opacity="0.6">&lt;SYS.EXIT // SESSION_COMPLETE&gt;</text>
  <text x="864" y="30" class="ft-tag" fill="#00f0ff" text-anchor="end" opacity="0.6">&lt;STATUS: NOMINAL&gt;</text>

  <!-- Thin divider under top tag -->
  <line x1="100" y1="38" x2="800" y2="38" stroke="#00f0ff" stroke-width="0.4" opacity="0.15"/>

  <!-- ===== Main Title ===== -->
  <text x="450" y="82" text-anchor="middle" class="ft-title" filter="url(#glowFt)">THANKS FOR VISITING</text>
  <!-- Glitch layers -->
  <text x="447.5" y="82" text-anchor="middle" class="ft-title" fill="#00f0ff" style="animation: glitchFt 7s infinite; opacity:0;">THANKS FOR VISITING</text>
  <text x="452.5" y="82" text-anchor="middle" class="ft-title" fill="#d946ef" style="animation: glitchFt 7s infinite 0.12s; opacity:0;">THANKS FOR VISITING</text>

  <!-- Decorative diamond -->
  <polygon points="450,92 453,95 450,98 447,95" fill="#00f0ff" opacity="0.5" filter="url(#glowFt)"/>

  <!-- Subtitle -->
  <text x="450" y="115" text-anchor="middle" class="ft-sub" opacity="0.8">
    // SIGNAL LOST &#183; SESSION TERMINATED &#183; RIOON7337 //
  </text>

  <!-- Bottom terminal prompt -->
  <g transform="translate(450, 145)">
    <rect x="-120" y="-10" width="240" height="17" rx="3.5" fill="#030b1c" stroke="#00f0ff" stroke-width="0.7" opacity="0.7"/>
    <circle cx="-106" cy="-1.5" r="2" fill="#00ff88" style="animation: fadeBreath 2s infinite;"/>
    <text x="0" y="2" font-family="'Fira Code', monospace" font-size="8" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">DISCONNECTING<tspan fill="#00f0ff" style="animation: cursorBlink 0.75s step-end infinite;"> _</tspan></text>
  </g>

  <!-- Border frame -->
  <path d="M 24 8 L 876 8 L 892 24 L 892 156 L 876 172 L 24 172 L 8 156 L 8 24 Z"
        fill="none" stroke="url(#frameFt)" stroke-width="1.5" opacity="0.85"/>

  <!-- Laser tracer -->
  <path d="M 24 8 L 876 8 L 892 24 L 892 156 L 876 172 L 24 172 L 8 156 L 8 24 Z"
        fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" opacity="0.75"
        pathLength="1000" stroke-dasharray="70 930" filter="url(#glowFt)"
        style="animation: lineSweep 5s linear infinite;"/>
</svg>