<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="wolfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#1c2430"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A8B99"/>
      <stop offset="50%" stop-color="#D3D9DF"/>
      <stop offset="100%" stop-color="#7A8B99"/>
    </linearGradient>
    <linearGradient id="goldWolf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A67B29"/>
      <stop offset="50%" stop-color="#F2C94C"/>
      <stop offset="100%" stop-color="#A67B29"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#wolfBg)"/>
  
  <!-- Medieval Shield Frame -->
  <path d="M 30 30 L 970 30 L 970 290 L 500 310 L 30 290 Z" fill="none" stroke="url(#steel)" stroke-width="3"/>
  <path d="M 40 40 L 960 40 L 960 280 L 500 298 L 40 280 Z" fill="none" stroke="#4B5E6F" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Geometric Wolf Head / Knight Helm Motif -->
  <g transform="translate(500, 130)" fill="none" stroke="url(#steel)" stroke-width="3" stroke-linejoin="round">
    <!-- Ears -->
    <path d="M -60 -40 L -40 -90 L -15 -50 Z" fill="#1c2430"/>
    <path d="M 60 -40 L 40 -90 L 15 -50 Z" fill="#1c2430"/>
    <!-- Helm/Wolf Snout -->
    <path d="M -50 -30 L 0 -10 L 50 -30 L 35 20 L 0 50 L -35 20 Z" fill="url(#wolfBg)" stroke="url(#goldWolf)"/>
    <!-- Eyes -->
    <path d="M -30 -5 L -15 5 L -25 15 Z" fill="#F2C94C"/>
    <path d="M 30 -5 L 15 5 L 25 15 Z" fill="#F2C94C"/>
    <!-- Snout lines -->
    <line x1="0" y1="-10" x2="0" y2="30" stroke="#7A8B99" stroke-width="2"/>
    <line x1="-15" y1="30" x2="15" y2="30" stroke="#7A8B99" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="500" y="220" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" font-style="italic"
        fill="url(#goldWolf)" letter-spacing="8">
    WOLF KNIGHT
  </text>
  
  <text x="500" y="255" text-anchor="middle"
        font-family="Georgia, serif" font-size="14" fill="#D3D9DF" letter-spacing="4">
    🐾 HARDWARE · FIRMWARE · ALGORITHMIC TRADING 🐾
  </text>
  
  <!-- Open to Work Badge -->
  <g transform="translate(500, 285)">
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#1c2430" stroke="url(#steel)" stroke-width="1.5"/>
    <circle cx="-75" cy="0" r="4" fill="#3fb950"/>
    <text x="5" y="5" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" font-weight="bold" fill="#F2C94C" letter-spacing="2">OPEN TO WORK</text>
  </g>
</svg>