<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="300" height="90">
  <defs>
    <linearGradient id="wbBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A8B99"/>
      <stop offset="100%" stop-color="#F2C94C"/>
    </linearGradient>
  </defs>

  <!-- Card shape: shield-like top corners -->
  <path d="M 12 2 L 288 2 L 298 12 L 298 78 L 288 88 L 12 88 L 2 78 L 2 12 Z"
        fill="#11161d" stroke="url(#wbBorder)" stroke-width="2"/>

  <!-- Corner rivets -->
  <g fill="#7A8B99">
    <circle cx="12" cy="12" r="2.5"/>
    <circle cx="288" cy="12" r="2.5"/>
    <circle cx="12" cy="78" r="2.5"/>
    <circle cx="288" cy="78" r="2.5"/>
  </g>

  <!-- Icon shield -->
  <path d="M 30 25 L 60 25 L 60 55 L 45 68 L 30 55 Z" fill="#1c2430" stroke="#D3D9DF" stroke-width="1.5"/>
  <!-- Threads Icon -->
  <g stroke="#F2C94C" fill="none" stroke-linecap="round">
    <path d="M47 43 c-.2-2.5-2.8-2.8-4-1.7" stroke-width="1.3"/>
    <path d="M44.5 49 C41 49 38.5 46.5 38.5 43 s2.5-6 6-6 c3 0 5 1.5 5.5 3.8" stroke-width="1.4"/>
    <path d="M47 43.5 c1.5.4 2.2 1.3 2 2.5 -.2 1.4-1.5 2.3-3 1.9 -1.6-.4-2.3-1.9-1.9-3.4 .3-1.2 1.3-1.9 2.7-1.8 1.6.1 2.7 1.1 3 2.7" stroke-width="1.2"/>
  </g>

  <!-- Platform name -->
  <text x="80" y="42"
        font-family="Georgia, serif" font-size="17" font-weight="bold"
        fill="#F2C94C" letter-spacing="2">
    THREADS
  </text>

  <!-- Status -->
  <circle cx="83" cy="60" r="3" fill="#3fb950"/>
  <text x="93" y="64"
        font-family="Verdana, sans-serif" font-size="9"
        fill="#7A8B99" letter-spacing="2">
    CONNECTED
  </text>

  <!-- Arrow (paw style) -->
  <g transform="translate(268, 45)" fill="#F2C94C">
    <circle cx="0" cy="0" r="3"/>
    <circle cx="-7" cy="-6" r="2"/>
    <circle cx="0" cy="-8" r="2"/>
    <circle cx="7" cy="-6" r="2"/>
  </g>
</svg>
