<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rioon7337 — Interactive GitHub Profile &amp; Audio Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07071a;
      color: #e0f2fe;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 56px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .full-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 840px;
      position: relative;
    }
    .social-grid a {
      display: inline-block;
      position: relative;
      border-radius: 14px;
      cursor: pointer;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      text-decoration: none;
      transform-origin: center center;
      transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.3),
                  filter 0.22s ease,
                  box-shadow 0.22s ease;
    }
    .social-grid img {
      height: 78px;
      width: 260px;
      display: block;
      pointer-events: none;
      border-radius: 12px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    /* --- Cyber HUD Target Lock Brackets (Appear on Hover) --- */
    .social-grid a::before,
    .social-grid a::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 5;
    }
    /* Top-Left Bracket (Electric Cyan) */
    .social-grid a::before {
      top: -4px;
      left: -4px;
      border-top: 2.5px solid #00f0ff;
      border-left: 2.5px solid #00f0ff;
      box-shadow: -2px -2px 10px rgba(0, 240, 255, 0.9);
      transform: translate(-8px, -8px);
    }
    /* Bottom-Right Bracket (Quantum Magenta) */
    .social-grid a::after {
      bottom: -4px;
      right: -4px;
      border-bottom: 2.5px solid #d946ef;
      border-right: 2.5px solid #d946ef;
      box-shadow: 2px 2px 10px rgba(217, 70, 239, 0.9);
      transform: translate(8px, 8px);
    }

    /* --- HOVER ANIMATION (Elevation, Target Lock, Aura Glow) --- */
    @keyframes cyberHoverGlitch {
      0% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-7px) scale(1.04) skewX(-1.5deg); }
      60% { transform: translateY(-5px) scale(1.03) skewX(1deg); }
      100% { transform: translateY(-6px) scale(1.035) skewX(0); }
    }
    @keyframes cyberAuraPulse {
      0%, 100% {
        filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.9))
                drop-shadow(0 0 32px rgba(217, 70, 239, 0.55))
                brightness(1.15);
      }
      50% {
        filter: drop-shadow(0 0 24px rgba(0, 240, 255, 1))
                drop-shadow(0 0 48px rgba(217, 70, 239, 0.75))
                brightness(1.25);
      }
    }
    .social-grid a:hover {
      animation: cyberHoverGlitch 0.25s ease-out forwards,
                 cyberAuraPulse 2s ease-in-out 0.25s infinite;
      z-index: 10;
    }
    .social-grid a:hover::before,
    .social-grid a:hover::after {
      opacity: 1;
      transform: translate(0, 0);
    }

    /* --- PRESSED / ACTIVE ANIMATION (Haptic Shockwave, Quantum Surge) --- */
    @keyframes cyberShockwave {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.9),
                    0 0 20px rgba(0, 240, 255, 0.8),
                    inset 0 0 20px rgba(0, 255, 136, 0.6);
      }
      50% {
        box-shadow: 0 0 0 14px rgba(0, 255, 136, 0.35),
                    0 0 45px rgba(0, 240, 255, 1),
                    inset 0 0 35px rgba(0, 255, 136, 0.8);
      }
      100% {
        box-shadow: 0 0 0 22px rgba(0, 255, 136, 0),
                    0 0 30px rgba(0, 240, 255, 0.6),
                    inset 0 0 15px rgba(0, 255, 136, 0.4);
      }
    }
    .social-grid a:active {
      transform: translateY(3px) scale(0.95) !important;
      animation: cyberShockwave 0.4s ease-out forwards !important;
      filter: drop-shadow(0 0 30px #00ff88)
              drop-shadow(0 0 60px #00f0ff)
              brightness(1.45)
              contrast(1.3) !important;
      transition: transform 0.05s ease, filter 0.05s ease;
    }
    .social-grid a:active::before {
      border-color: #00ff88;
      box-shadow: -2px -2px 14px #00ff88;
      transform: translate(2px, 2px) scale(0.9);
    }
    .social-grid a:active::after {
      border-color: #00ff88;
      box-shadow: 2px 2px 14px #00ff88;
      transform: translate(-2px, -2px) scale(0.9);
    }

    /* --- Interactive Cyber Telemetry Status Bar --- */
    .uplink-hud-bar {
      width: 100%;
      max-width: 820px;
      padding: 9px 16px;
      margin-top: 4px;
      margin-bottom: 4px;
      background: rgba(6, 12, 34, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 12px rgba(0, 240, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Fira Code', monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00f0ff;
      transition: all 0.25s ease;
    }
    .uplink-hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      transition: all 0.25s ease;
    }
    .uplink-hud-bar.active-surge {
      border-color: #00ff88;
      color: #00ff88;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.5), inset 0 0 15px rgba(0, 255, 136, 0.25);
    }
    .uplink-hud-bar.active-surge .uplink-hud-dot {
      background: #00ff88;
      box-shadow: 0 0 16px #00ff88;
      transform: scale(1.4);
    }

    /* Spotify Desktop Split-View Container (Cyberpunk Neon) */
    .desk-wrap {
      width: 100%;
      margin-top: 10px;
      padding: 3px;
      position: relative;
    }
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes spinRgb { to { --angle: 360deg; } }
    .desk-glow {
      position: absolute;
      inset: 2px;
      border-radius: 18px;
      background: conic-gradient(from var(--angle), #00f0ff, #d946ef, #00ffcc, #ff73fa, #00f0ff);
      animation: spinRgb 6s linear infinite;
      filter: blur(10px);
      opacity: 0.35;
      z-index: 0;
    }
    .desk-card {
      position: relative;
      z-index: 1;
      background: #0a142e;
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      overflow: hidden;
      height: 540px;
    }
    @media (max-width: 860px) {
      .desk-card {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sp-left {
        height: auto !important;
        border-right: none !important;
        border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      }
      .sp-right {
        height: 460px !important;
      }
    }
    .chap-pill {
      background: rgba(10, 26, 62, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 6px;
      color: #00f0ff;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chap-pill:hover {
      background: #00f0ff;
      color: #07071a;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      transform: translateY(-1px);
    }

    /* Left Player Controls */
    .sp-left {
      background: linear-gradient(180deg, #0d1a3e 0%, #070c20 100%);
      padding: 22px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 240, 255, 0.15);
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .sp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00f0ff;
      margin-bottom: 20px;
    }
    .sp-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.3);
      margin-bottom: 20px;
    }
    .sp-cover-left {
      width: 48%;
      background: linear-gradient(135deg, #07071a, #0a1a3e);
      padding: 12px;
      display: flex;
      align-items: center;
    }
    .sp-vert {
      display: flex;
      flex-direction: column;
      font-family: 'Arial Black', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #00f0ff;
      line-height: 1.25;
      letter-spacing: 0.5px;
    }
    .sp-cover-right {
      width: 52%;
      background: radial-gradient(circle at 60% 40%, #1a2a5a, #070c20);
      position: relative;
    }
    .sp-cover-title {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: 'Arial Black', sans-serif;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      gap: 5px;
      align-items: baseline;
    }
    .sp-black { color: #00f0ff; }
    .sp-amp { color: #ffffff; }
    .sp-blue { color: #d946ef; }

    .sp-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .sp-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .sp-artist {
      font-size: 12px;
      font-weight: 600;
      color: #a0b0d0;
      margin-top: 2px;
    }
    .sp-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #00ff88;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Progress bar */
    .sp-prog-bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }
    .sp-prog-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #00ffcc);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    }
    .sp-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: #7080a0;
      margin-bottom: 14px;
      font-family: 'Fira Code', monospace;
    }

    /* Controls */
    .sp-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .sp-icon-btn {
      background: none;
      border: none;
      color: #a0b0d0;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sp-icon-btn:hover { color: #00f0ff; transform: scale(1.1); }
    .sp-play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00f0ff;
      color: #07071a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .sp-play-btn:hover { transform: scale(1.08); background: #00ffcc; }

    .sp-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 700;
      color: #00ff88;
    }
    .sp-device {
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1px;
    }
    .vol-mini {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vol-mini input[type=range] {
      width: 70px;
      accent-color: #00f0ff;
      cursor: pointer;
    }

    /* Right: Scrolling Lyrics */
    .sp-right {
      background: #060b1c;
      display: flex;
      flex-direction: column;
      padding: 22px 24px;
      position: relative;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .lyrics-head {
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .lyrics-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1.5px;
    }
    .lyrics-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .lyrics-viewport {
      flex: 1;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(180deg, transparent 0%, black 8%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 8%, black 85%, transparent 100%);
    }
    .lyrics-track {
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 20px;
      padding-bottom: 260px;
      will-change: transform;
    }
    .lyric-item {
      font-size: 19px;
      font-weight: 700;
      color: #384560;
      transition: color 0.3s ease, font-size 0.3s ease, transform 0.3s ease;
      cursor: pointer;
      line-height: 1.35;
    }
    .lyric-item.active {
      color: #ffffff;
      font-size: 23px;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.8), 0 0 28px rgba(0, 240, 255, 0.4);
      transform: translateX(6px);
    }
    .lyric-item.passed {
      color: #6a7c9f;
    }

    /* ===== FIXED CYBER BACK BUTTON ===== */
    .cyber-back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 18px;
      background: rgba(6, 14, 38, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 240, 255, 0.6);
      border-radius: 10px;
      color: #00f0ff;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 240, 255, 0.35);
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.25, 1);
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    .cyber-back-btn svg {
      width: 16px;
      height: 16px;
      stroke: #00f0ff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.22s ease, stroke 0.22s ease;
    }
    .cyber-back-btn .back-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      animation: blinkDot 1.6s infinite;
    }
    .cyber-back-btn:hover {
      background: rgba(10, 24, 60, 0.95);
      border-color: #00f0ff;
      color: #ffffff;
      transform: translateX(-3px) scale(1.04);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8),
                  0 0 20px rgba(0, 240, 255, 0.85),
                  0 0 40px rgba(217, 70, 239, 0.45);
    }
    .cyber-back-btn:hover svg {
      transform: translateX(-3px);
      stroke: #ffffff;
      filter: drop-shadow(0 0 6px #00f0ff);
    }
    .cyber-back-btn:active {
      transform: scale(0.94);
      background: #061c2c;
      border-color: #00ff88;
      color: #00ff88;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.7), inset 0 0 14px rgba(0, 255, 136, 0.3);
    }
    .cyber-back-btn:active svg {
      stroke: #00ff88;
    }
    @media (max-width: 600px) {
      .cyber-back-btn {
        top: 12px;
        left: 12px;
        padding: 8px 14px;
        font-size: 11px;
      }
    }
  </style>
</head>

      [240.0, "♪ // [04:00] Outro - Sol Bird"]
    ];

    let ytPlayer = null;
    let ytTimer = null;
    const lyricsTrack = document.getElementById('lyricsTrack');
    const statusText = document.getElementById('statusText');

    // Build lyrics elements
    LYRICS.forEach(([time, text], idx) => {
      const el = document.createElement('div');
      el.className = 'lyric-item';
      el.textContent = text;
      el.dataset.time = time;
      el.dataset.index = idx;
      el.title = `Klik untuk memutar dari ${time}s`;
      el.addEventListener('click', () => {
        seekVideo(time);
      });
      lyricsTrack.appendChild(el);
    });

    const lyricElements = Array.from(document.querySelectorAll('.lyric-item'));

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytVideoFrame', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        statusText.textContent = "PLAYING \u2014 KIN'U (SOL BIRD) // Luowei feat. Rouon Aro";
        if (!ytTimer) {
          ytTimer = setInterval(checkSync, 300);
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        statusText.textContent = 'PAUSED';
      } else if (event.data === YT.PlayerState.ENDED) {
        statusText.textContent = 'SELESAI // TERIMA KASIH TELAH MENONTON';
        if (ytTimer) {
          clearInterval(ytTimer);
          ytTimer = null;
        }
      }
    }

    function checkSync() {
      if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
      const cur = ytPlayer.getCurrentTime();
      updateLyrics(cur);
    }

    function updateLyrics(cur) {
      let activeIdx = 0;
      for (let i = 0; i < LYRICS.length; i++) {
        if (cur >= LYRICS[i][0]) {
          activeIdx = i;
        } else {
          break;
        }
      }

      lyricElements.forEach((el, idx) => {
        if (idx === activeIdx) {
          el.className = 'lyric-item active';
        } else if (idx < activeIdx) {
          el.className = 'lyric-item passed';
        } else {
          el.className = 'lyric-item';
        }
      });

      const activeEl = lyricElements[activeIdx];
      const viewport = document.getElementById('lyricsViewport');
      if (activeEl && viewport) {
        // Lirik hanya akan naik jika posisinya sudah melewati batas tampilan (38% dari tinggi viewport)
        const threshold = viewport.clientHeight * 0.38;
        const itemTop = activeEl.offsetTop;
        if (itemTop > threshold) {
          const scrollOffset = itemTop - threshold;
          lyricsTrack.style.transform = `translateY(-${scrollOffset}px)`;
        } else {
          lyricsTrack.style.transform = 'translateY(0px)';
        }
      }
    }

    function seekVideo(seconds) {
      if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
        ytPlayer.seekTo(seconds, true);
        ytPlayer.playVideo();
      } else {
        const frame = document.getElementById('ytVideoFrame');
        if (frame) {
          frame.src = `https://www.youtube.com/embed/mL-Fwq6jg8o?enablejsapi=1&autoplay=1&start=${Math.floor(seconds)}`;
        }
      }
      updateLyrics(seconds);
    }

    // Check hash for autoplay on load
    if (window.location.hash === '#player') {
      window.addEventListener('load', () => {
        document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
      });
    }

    // Cyber Connect Uplink Interactive Audio-Visual Feedback
    let audioCtx = null;
    function playCyberChirp(freq1 = 880, freq2 = 1760, duration = 0.08) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const uplinkHud = document.getElementById('uplinkHud');
    const uplinkHudText = document.getElementById('uplinkHudText');
    const socialLinks = document.querySelectorAll('.social-grid a');

    socialLinks.forEach(link => {
      const nodeName = link.getAttribute('data-node') || 'NODE';
      link.addEventListener('mouseenter', () => {
        if (uplinkHudText) {
          uplinkHudText.textContent = `[ TARGET ACQUIRED // NODE: ${nodeName} // FREQ: 5.84 GHz // ARMED ]`;
        }
      });
      link.addEventListener('mouseleave', () => {
        if (uplinkHudText && !uplinkHud.classList.contains('active-surge')) {
          uplinkHudText.textContent = '[ SYS.READY // HOVER TO LOCK NODE · CLICK TO TRANSMIT UPLINK ]';
        }
      });
      link.addEventListener('mousedown', () => {
        playCyberChirp(440, 1800, 0.1);
        if (uplinkHud && uplinkHudText) {
          uplinkHud.classList.add('active-surge');
          uplinkHudText.textContent = `[ >> QUANTUM UPLINK TRANSMITTED // CONNECTING TO ${nodeName}... << ]`;
          setTimeout(() => {
            uplinkHud.classList.remove('active-surge');
            uplinkHudText.textContent = '[ SYS.READY // HOVER TO LOCK NODE · CLICK TO TRANSMIT UPLINK ]';
          }, 1200);
        }
      });
    });
    // Cyber Navigation Return Function
    function goBack(e) {

      setTimeout(() => {
        window.location.href = 'https://github.com/Rioon7337';
      }, 100);
    }
