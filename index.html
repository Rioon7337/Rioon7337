<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rioon7337 — Interactive GitHub Profile &amp; Audio Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07071a;
      color: #e0f2fe;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 56px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .full-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 820px;
    }
    .social-grid a {
      display: inline-block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .social-grid a:hover {
      transform: translateY(-3px) scale(1.02);
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
    }
    .social-grid img {
      height: 78px;
      width: auto;
      display: block;
    }

    /* Spotify Desktop Split-View Container (Cyberpunk Neon) */
    .desk-wrap {
      width: 100%;
      margin-top: 10px;
      padding: 3px;
      position: relative;
    }
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes spinRgb { to { --angle: 360deg; } }
    .desk-glow {
      position: absolute;
      inset: 2px;
      border-radius: 18px;
      background: conic-gradient(from var(--angle), #00f0ff, #d946ef, #00ffcc, #ff73fa, #00f0ff);
      animation: spinRgb 6s linear infinite;
      filter: blur(10px);
      opacity: 0.35;
      z-index: 0;
    }
    .desk-card {
      position: relative;
      z-index: 1;
      background: #0a142e;
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      display: grid;
      grid-template-columns: 340px 1fr;
      overflow: hidden;
      min-height: 520px;
    }
    @media (max-width: 768px) {
      .desk-card { grid-template-columns: 1fr; }
    }

    /* Left Player Controls */
    .sp-left {
      background: linear-gradient(180deg, #0d1a3e 0%, #070c20 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 240, 255, 0.15);
    }
    .sp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00f0ff;
      margin-bottom: 20px;
    }
    .sp-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.3);
      margin-bottom: 20px;
    }
    .sp-cover-left {
      width: 48%;
      background: linear-gradient(135deg, #07071a, #0a1a3e);
      padding: 12px;
      display: flex;
      align-items: center;
    }
    .sp-vert {
      display: flex;
      flex-direction: column;
      font-family: 'Arial Black', sans-serif;
      font-size: 11px;
      font-weight: 900;
      color: #00f0ff;
      line-height: 1.25;
      letter-spacing: 0.5px;
    }
    .sp-cover-right {
      width: 52%;
      background: radial-gradient(circle at 60% 40%, #1a2a5a, #070c20);
      position: relative;
    }
    .sp-cover-title {
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: 'Arial Black', sans-serif;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      gap: 5px;
      align-items: baseline;
    }
    .sp-black { color: #00f0ff; }
    .sp-amp { color: #ffffff; }
    .sp-blue { color: #d946ef; }

    .sp-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .sp-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }
    .sp-artist {
      font-size: 12px;
      font-weight: 600;
      color: #a0b0d0;
      margin-top: 2px;
    }
    .sp-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #00ff88;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Progress bar */
    .sp-prog-bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }
    .sp-prog-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #00ffcc);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    }
    .sp-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: #7080a0;
      margin-bottom: 14px;
      font-family: 'Fira Code', monospace;
    }

    /* Controls */
    .sp-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .sp-icon-btn {
      background: none;
      border: none;
      color: #a0b0d0;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sp-icon-btn:hover { color: #00f0ff; transform: scale(1.1); }
    .sp-play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00f0ff;
      color: #07071a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .sp-play-btn:hover { transform: scale(1.08); background: #00ffcc; }

    .sp-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 700;
      color: #00ff88;
    }
    .sp-device {
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1px;
    }
    .vol-mini {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vol-mini input[type=range] {
      width: 70px;
      accent-color: #00f0ff;
      cursor: pointer;
    }

    /* Right: Scrolling Lyrics */
    .sp-right {
      background: #060b1c;
      display: flex;
      flex-direction: column;
      padding: 24px;
      position: relative;
    }
    .lyrics-head {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lyrics-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 1.5px;
    }
    .lyrics-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .lyrics-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%);
    }
    .lyrics-track {
      transition: transform 0.4s ease-out;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 160px 0;
    }
    .lyric-item {
      font-size: 19px;
      font-weight: 700;
      color: #384560;
      transition: color 0.3s ease, font-size 0.3s ease, transform 0.3s ease;
      cursor: pointer;
      line-height: 1.35;
    }
    .lyric-item.active {
      color: #ffffff;
      font-size: 23px;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.8), 0 0 28px rgba(0, 240, 255, 0.4);
      transform: translateX(6px);
    }
    .lyric-item.passed {
      color: #6a7c9f;
    }
  </style>
</head>

  <audio id="localAudio" src="./RouonAro_SolBird.m4a" preload="auto" loop></audio>

  <script>
    const LYRICS = [
      [0, "♪ // Intro - 金烏 (Sol Bird)"],
      [27.0, "籠の鳥のことだった"],
      [32.0, "囚われて 鳴き続ける"],
      [37.0, "錆び付いた体でも"],
      [44.0, "夜の風 思想が馳せる"],
      [48.0, "地下の根を伸ばせる"],
      [52.0, "鮮烈な叫びを上げる"],
      [56.0, "千切れた紙に書く"],
      [59.0, "誰かの不幸を刺す"],
      [61.5, "雪と混ざる凍りついた雨"],
      [65.0, "そっと頬を伝う理由"],
      [70.0, "ほら 壊されるような味のないまま 空の下"],
      [82.0, "この詩 いつか芽吹けば"],
      [87.0, "ばらまくように 振った翼さらば"],
      [92.5, "動けなくても代わりに行こう白夜"],
      [100.0, "取り戻そう照らそう"],
      [107.0, "もう一度明日を謳おう"],
      [115.0, "♪ // [01:55] Interlude"],
      [146.0, "どんな拙い模倣でも"],
      [151.0, "縛られて やり続ける"],
      [157.0, "錆び付いた記憶でも"],
      [161.0, "曖昧な夢 君の声"],
      [166.0, "この世のない滅び得ぬもの"],
      [171.0, "空ろな僕の骨まで満たす"],
      [176.0, "足らせ！ 君の方向へ"],
      [180.0, "飛んで日暮れて倦鳥 やがて巣へ"],
      [187.0, "ほら 捨てられたような流離のまま 泣いたおもちゃ"],
      [200.0, "この歌 実を結べば"],
      [205.0, "ばらまくように 振った翼さらば"],
      [210.0, "一緒じゃなくても共に往こう"],
      [219.0, "結局 取り戻そう直そう"],
      [226.0, "もう一度明日を謳おう"],
      [240.0, "♪ // [04:00] Outro - Sol Bird"]
    ];

    const audio = document.getElementById('localAudio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const elapsedTime = document.getElementById('elapsedTime');
    const remainingTime = document.getElementById('remainingTime');
    const volumeSlider = document.getElementById('volumeSlider');
    const lyricsTrack = document.getElementById('lyricsTrack');
    const statusText = document.getElementById('statusText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const chorusBtn = document.getElementById('chorusBtn');

    // Build lyrics elements
    LYRICS.forEach(([time, text], idx) => {
      const el = document.createElement('div');
      el.className = 'lyric-item';
      el.textContent = text;
      el.dataset.time = time;
      el.dataset.index = idx;
      el.addEventListener('click', () => {
        audio.currentTime = time;
        if (audio.paused) playAudio();
      });
      lyricsTrack.appendChild(el);
    });

    const lyricElements = Array.from(document.querySelectorAll('.lyric-item'));

    function fmt(s) {
      if (isNaN(s) || s < 0) s = 0;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function playAudio() {
      audio.play().then(() => {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        statusText.textContent = 'PLAYING — 金烏 (SOL BIRD) // 羅威 feat. 狼音アロ';
      }).catch(err => {
        console.warn('Autoplay blocked:', err);
      });
    }

    function pauseAudio() {
      audio.pause();
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      statusText.textContent = 'PAUSED';
    }

    playPauseBtn.addEventListener('click', () => {
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    prevBtn.addEventListener('click', () => {
      audio.currentTime = 0;
      if (audio.paused) playAudio();
    });

    chorusBtn.addEventListener('click', () => {
      audio.currentTime = 70.0;
      if (audio.paused) playAudio();
    });

    nextBtn.addEventListener('click', () => {
      audio.currentTime = 187.0;
      if (audio.paused) playAudio();
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = pos * audio.duration;
      }
    });

    audio.addEventListener('timeupdate', () => {
      const cur = audio.currentTime;
      const dur = audio.duration || 252;
      const pct = (cur / dur) * 100;
      progressFill.style.width = pct + '%';
      elapsedTime.textContent = fmt(cur);
      remainingTime.textContent = '-' + fmt(dur - cur);

      // Active lyric sync
      let activeIdx = 0;
      for (let i = 0; i < LYRICS.length; i++) {
        if (cur >= LYRICS[i][0]) {
          activeIdx = i;
        } else {
          break;
        }
      }

      lyricElements.forEach((el, idx) => {
        if (idx === activeIdx) {
          el.className = 'lyric-item active';
        } else if (idx < activeIdx) {
          el.className = 'lyric-item passed';
        } else {
          el.className = 'lyric-item';
        }
      });

      const activeEl = lyricElements[activeIdx];
      if (activeEl) {
        const offset = activeEl.offsetTop - 160;
        lyricsTrack.style.transform = `translateY(-${Math.max(0, offset)}px)`;
      }
    });

    // Check hash for autoplay on load
    if (window.location.hash === '#player') {
      window.addEventListener('load', () => {
        document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
      });
    }
  </script>
</body>
</html>
