  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07071a;
      color: #e0f2fe;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 56px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .full-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 820px;
    }
    .social-grid a {
      display: inline-block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .social-grid a:hover {
      transform: translateY(-3px) scale(1.02);
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
    }
    .social-grid img {
      height: 78px;
      width: auto;
      display: block;
    }

    /* Spotify Desktop Split-View Container (Cyberpunk Neon) */
    .desk-wrap {
      width: 100%;
      margin-top: 10px;
      padding: 3px;
      position: relative;
    }
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes spinRgb { to { --angle: 360deg; } }
    .desk-glow {
      position: absolute;
      inset: 2px;
      border-radius: 18px;
      background: conic-gradient(from var(--angle), #00f0ff, #d946ef, #00ffcc, #ff73fa, #00f0ff);
      animation: spinRgb 6s linear infinite;
      filter: blur(10px);
      opacity: 0.35;
      z-index: 0;
    }
    .desk-card {
      position: relative;
      z-index: 1;
      background: #0a142e;
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      overflow: hidden;
      min-height: 520px;
    }
    @media (max-width: 860px) {
      .desk-card { grid-template-columns: 1fr; }
    }
    .chap-pill {
      background: rgba(10, 26, 62, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 6px;
      color: #00f0ff;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chap-pill:hover {
      background: #00f0ff;
      color: #07071a;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      transform: translateY(-1px);
    }

    /* Left Player Controls */
    .sp-left {
      background: linear-gradient(180deg, #0d1a3e 0%, #070c20 100%);
      padding: 24px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(0, 240, 255, 0.15);
    }
    .sp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00f0ff;
      margin-bottom: 20px;
    }
    .sp-cover {

      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);

    .sp-cover-left {

    .sp-cover-right {

    }
    .sp-cover-title {

      bottom: 12px;
      left: 12px;

      font-size: 16px;

    /* Controls */
    .sp-controls {

    }
    .sp-icon-btn {

    .sp-play-btn {

      transition: transform 0.15s ease, background 0.15s ease;
    }
    .sp-play-btn:hover { transform: scale(1.08); background: #00ffcc; }

    .sp-bottom {

    .sp-device {

    /* Right: Scrolling Lyrics */
    .sp-right {
      background: #060b1c;

      padding: 24px;

    }
    .lyrics-head {

    .lyrics-badge {
      display: flex;

    .lyrics-dot {
      width: 8px;

      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .lyrics-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%);
    }
    .lyrics-track {
      transition: transform 0.4s ease-out;
      display: flex;

      gap: 20px;
      padding: 160px 0;
    }
    .lyric-item {
      font-size: 19px;

      color: #384560;

    .lyric-item.active {

      transform: translateX(6px);
    }
    .lyric-item.passed {
      color: #6a7c9f;
    }

  <script>
    const LYRICS = [
      [0, "♪ // Intro - 金烏 (Sol Bird)"],
      [27.0, "籠の鳥のことだった"],
      [32.0, "囚われて 鳴き続ける"],
      [37.0, "錆び付いた体でも"],
      [44.0, "夜の風 思想が馳せる"],
      [48.0, "地下の根を伸ばせる"],
      [52.0, "鮮烈な叫びを上げる"],
      [56.0, "千切れた紙に書く"],
      [59.0, "誰かの不幸を刺す"],
      [61.5, "雪と混ざる凍りついた雨"],
      [65.0, "そっと頬を伝う理由"],
      [70.0, "ほら 壊されるような味のないまま 空の下"],
      [82.0, "この詩 いつか芽吹けば"],
      [87.0, "ばらまくように 振った翼さらば"],
      [92.5, "動けなくても代わりに行こう白夜"],
      [100.0, "取り戻そう照らそう"],
      [107.0, "もう一度明日を謳おう"],
      [115.0, "♪ // [01:55] Interlude"],
      [146.0, "どんな拙い模倣でも"],
      [151.0, "縛られて やり続ける"],
      [157.0, "錆び付いた記憶でも"],
      [161.0, "曖昧な夢 君の声"],
      [166.0, "この世のない滅び得ぬもの"],
      [171.0, "空ろな僕の骨まで満たす"],
      [176.0, "足らせ！ 君の方向へ"],
      [180.0, "飛んで日暮れて倦鳥 やがて巣へ"],
      [187.0, "ほら 捨てられたような流離のまま 泣いたおもちゃ"],
      [200.0, "この歌 実を結べば"],
      [205.0, "ばらまくように 振った翼さらば"],
      [210.0, "一緒じゃなくても共に往こう"],
      [219.0, "結局 取り戻そう直そう"],
      [226.0, "もう一度明日を謳おう"],
      [240.0, "♪ // [04:00] Outro - Sol Bird"]
    ];

    let ytPlayer = null;
    let ytTimer = null;
    const lyricsTrack = document.getElementById('lyricsTrack');
    const statusText = document.getElementById('statusText');

    // Build lyrics elements
    LYRICS.forEach(([time, text], idx) => {
      const el = document.createElement('div');
      el.className = 'lyric-item';
      el.textContent = text;
      el.dataset.time = time;
      el.dataset.index = idx;
      el.title = `Klik untuk memutar dari ${time}s`;
      el.addEventListener('click', () => {
        seekVideo(time);
      });
      lyricsTrack.appendChild(el);
    });

    const lyricElements = Array.from(document.querySelectorAll('.lyric-item'));

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytVideoFrame', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        statusText.textContent = 'PLAYING — 金烏 (SOL BIRD) // 羅威 feat. 狼音アロ';
        if (!ytTimer) {
          ytTimer = setInterval(checkSync, 300);
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        statusText.textContent = 'PAUSED';
      } else if (event.data === YT.PlayerState.ENDED) {
        statusText.textContent = 'SELESAI // TERIMA KASIH TELAH MENONTON';
        if (ytTimer) {
          clearInterval(ytTimer);
          ytTimer = null;
        }
      }
    }

    function checkSync() {
      if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
      const cur = ytPlayer.getCurrentTime();
      updateLyrics(cur);
    }

    function updateLyrics(cur) {
      let activeIdx = 0;
      for (let i = 0; i < LYRICS.length; i++) {
        if (cur >= LYRICS[i][0]) {
          activeIdx = i;
        } else {
          break;
        }
      }

      lyricElements.forEach((el, idx) => {
        if (idx === activeIdx) {
          el.className = 'lyric-item active';
        } else if (idx < activeIdx) {
          el.className = 'lyric-item passed';
        } else {
          el.className = 'lyric-item';
        }
      });

      const activeEl = lyricElements[activeIdx];
      if (activeEl) {
        const offset = activeEl.offsetTop - 160;
        lyricsTrack.style.transform = `translateY(-${Math.max(0, offset)}px)`;
      }
    }

    function seekVideo(seconds) {
      if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
        ytPlayer.seekTo(seconds, true);
        ytPlayer.playVideo();
      } else {
        const frame = document.getElementById('ytVideoFrame');
        if (frame) {
          frame.src = `https://www.youtube.com/embed/mL-Fwq6jg8o?enablejsapi=1&autoplay=1&start=${Math.floor(seconds)}`;
        }
      }
      updateLyrics(seconds);
    }

    // Check hash for autoplay on load
    if (window.location.hash === '#player') {
      window.addEventListener('load', () => {
        document.getElementById('player').scrollIntoView({ behavior: 'smooth' });
      });
    }
  </script>
