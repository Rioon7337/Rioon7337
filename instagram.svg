<svg xmlns="http://www.w3.org/2000/svg" width="260" height="78" viewBox="0 0 260 78" role="img" aria-label="INSTAGRAM">
  <defs>
    <linearGradient id="bg_instagram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a1c"/>
      <stop offset="60%" stop-color="#071330"/>
      <stop offset="100%" stop-color="#040614"/>
    </linearGradient>

    <linearGradient id="edge_instagram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <filter id="glow_instagram" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid_instagram" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#ff007f" stroke-width="0.3" opacity="0.08"/>
    </pattern>

    <linearGradient id="sweep_instagram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ff007f" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <!-- Chamfered Keycard Clip -->
    <clipPath id="clip_instagram">
      <path d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <path d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z" fill="url(#bg_instagram)"/>
  <rect x="2" y="2" width="256" height="74" fill="url(#grid_instagram)" clip-path="url(#clip_instagram)"/>

  <!-- Glowing Edge Border -->
  <path d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z"
        fill="none" stroke="url(#edge_instagram)" stroke-width="1.6" opacity="0.9" filter="url(#glow_instagram)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="0.6s" repeatCount="indefinite"/>
  </path>

  <!-- Traveling Dash Sweep -->
  <path d="M 14 2 L 246 2 L 258 14 L 258 64 L 246 76 L 14 76 L 2 64 L 2 14 Z"
        fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" pathLength="600" stroke-dasharray="60 540">
    <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
  </path>

  <!-- Light Sweep Effect -->
  <g clip-path="url(#clip_instagram)">
    <rect x="-260" y="0" width="260" height="78" fill="url(#sweep_instagram)">
      <animate attributeName="x" from="-260" to="260" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Cyber Corners -->
  <g stroke="#ff007f" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M7 24 L7 16 L16 7 L24 7"/>
    <path d="M253 24 L253 16 L244 7 L236 7"/>
    <path d="M7 54 L7 62 L16 71 L24 71"/>
    <path d="M253 54 L253 62 L244 71 L236 71"/>
  </g>

  <!-- Icon Chamber (Left Side) -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#06122c" stroke="#ff007f" stroke-width="1.2" opacity="0.9"/>
    <g transform="translate(6, 6)"><rect x="2.5" y="2.5" width="18" height="18" rx="5" fill="none" stroke="#ff007f" stroke-width="1.8"/><circle cx="11.5" cy="11.5" r="4.2" fill="none" stroke="#ff007f" stroke-width="1.8"/><circle cx="16.5" cy="6.5" r="1.3" fill="#ff007f"/></g>
  </g>

  <!-- Node Code Identifier -->
  <text x="64" y="24" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#ff007f">NODE.04 // INSTAGRAM</text>

  <!-- Main Platform Label -->
  <text x="64" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#glow_instagram)">INSTAGRAM</text>

  <!-- Status Telemetry Line -->
  <g transform="translate(64, 58)">
    <circle cx="4" cy="-3.5" r="2.5" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="0" font-family="'Fira Code', monospace" font-size="9" font-weight="600" letter-spacing="1.2" fill="#00ffcc">VISUAL: 60FPS</text>
  </g>

  <!-- Cyber Navigation Chevron >>> -->
  <g stroke="#d946ef" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(224, 34)">
    <path d="M0 0 L5 5 L0 10">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M6 0 L11 5 L6 10" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>